<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchTwitch</title>
  <style>
    /* Заставка при запуске.
     *
     * Окно прозрачное и чуть больше карточки: место под мягкую тень.
     * Цвета свои — themes.css заставка не грузит. Сцена тёмная и
     * нейтральная; единственное цветное пятно — свечение за логотипом:
     * это знак приложения, а не фон.
     *
     * Полоса показывает настоящие этапы запуска (их присылает main через
     * window.splash.stage). Не пришло ни одного за 1,2 с — полоса переходит
     * в «неопределённый» бег, чтобы не казалось, что всё встало.
     */
    :root {
      --text: #ececf0;
      --text-2: #a3a7b1;
      --text-3: #858a95;
      --accent: #7c5cff;
      --track: rgba(255, 255, 255, 0.08);
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .card {
      position: relative;
      width: 380px;
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 34px;
      background: linear-gradient(180deg, #17181b 0%, #111214 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.42), 0 1px 3px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: card-in 260ms var(--ease-out) both;
    }

    body.done .card {
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 180ms ease-in, transform 180ms ease-in;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      z-index: 1;
    }

    .logo-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180px;
      height: 180px;
      margin: -90px 0 0 -90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.22) 0%, transparent 70%);
      animation: glow 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow {
      0%, 100% { transform: scale(0.9); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .logo {
      position: relative;
      display: block;
      width: 72px;
      height: 72px;
      border-radius: 18px;
    }

    .app-name {
      position: relative;
      margin-top: 18px;
      font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      font-size: 22px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .app-tagline {
      position: relative;
      margin-top: 2px;
      font-size: 13px;
      line-height: 18px;
      color: var(--text-2);
    }

    .progress {
      position: relative;
      width: 200px;
      height: 4px;
      margin-top: 28px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 400ms ease-out;
    }

    /* Неопределённый бег — пока не пришёл ни один этап */
    .progress.indeterminate .progress-fill {
      width: 40%;
      transition: none;
      animation: run 1.4s ease-in-out infinite;
    }

    @keyframes run {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    .stage {
      position: relative;
      margin-top: 10px;
      min-height: 16px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .version {
      position: absolute;
      right: 14px;
      bottom: 10px;
      font-size: 11px;
      line-height: 14px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -6px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(-280px) translateX(24px); opacity: 0; }
    }

    .particle:nth-child(1) { left: 12%; animation-duration: 7.5s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 28%; animation-duration: 9s; animation-delay: 1.2s; }
    .particle:nth-child(3) { left: 44%; animation-duration: 8s; animation-delay: 2.4s; }
    .particle:nth-child(4) { left: 60%; animation-duration: 10s; animation-delay: 0.6s; }
    .particle:nth-child(5) { left: 74%; animation-duration: 8.5s; animation-delay: 1.8s; }
    .particle:nth-child(6) { left: 88%; animation-duration: 9.5s; animation-delay: 3s; }

    @media (prefers-reduced-motion: reduce) {
      .particles { display: none; }
      .logo-glow { animation: none; }
      .card { animation: none; }
      .progress.indeterminate .progress-fill { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <div class="particles" aria-hidden="true">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <div class="logo-wrap">
      <div class="logo-glow" aria-hidden="true"></div>
      <img class="logo" src="assets/logo.svg" alt="" width="72" height="72">
    </div>

    <div class="app-name">WatchTwitch</div>
    <div class="app-tagline">Фарминг дропсов Twitch</div>

    <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="stage" id="stage">Запуск…</div>

    <div class="version" id="version"></div>
  </div>

  <script>
    (function () {
      var progress = document.getElementById('progress');
      var fill = document.getElementById('progress-fill');
      var stageText = document.getElementById('stage');
      var current = -1;
      var gotStage = false;

      try {
        var v = new URLSearchParams(location.search).get('v');
        if (v && /^[\w.\-]{1,32}$/.test(v)) document.getElementById('version').textContent = 'v' + v;
      } catch (e) { /* без версии */ }

      // Язык передаёт main (?lang=…) — тот же, что у трея. Строк всего две,
      // поэтому свой словарь, а не tr.js с файлами переводов. Этапы main
      // присылает уже переведёнными
      var en = false;
      try {
        en = new URLSearchParams(location.search).get('lang') === 'en';
      } catch (e) { /* без параметра — по-русски */ }
      var EN = {
        'Фарминг дропсов Twitch': 'Twitch drops farming', // i18n-ignore: словарь заставки
        'Запуск…': 'Starting…' // i18n-ignore: словарь заставки
      };
      var t = function (ru) { return en && EN[ru] ? EN[ru] : ru; };
      if (en) {
        document.documentElement.lang = 'en';
        var tagline = document.querySelector('.app-tagline');
        if (tagline) tagline.textContent = t(tagline.textContent.trim());
      }

      window.splash = {
        // Этапы только растут: поздний ответ о раннем этапе полосу назад не двигает
        stage: function (index, text, percent) {
          if (index < current) return;
          current = index;
          if (index > 0) gotStage = true;
          progress.classList.remove('indeterminate');
          var p = Math.max(0, Math.min(100, Number(percent) || 0));
          fill.style.width = p + '%';
          if (text) stageText.textContent = text;
        },
        done: function () {
          document.body.classList.add('done');
        }
      };

      window.splash.stage(0, t('Запуск…'), 12); // i18n-ignore: переводит t() выше

      // Ни одного этапа от main за 1,2 с — бег, а не застывшие 12%
      setTimeout(function () {
        if (!gotStage) progress.classList.add('indeterminate');
      }, 1200);
    })();
  </script>
</body>
</html>

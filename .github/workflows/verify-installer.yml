name: Verify Windows installer 1.3.2
on:
  push:
    branches: [build/verify-1.3.2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf40046bff44510960931b5f20f2c3a3aaf1aa35
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:win -- --publish never
      - shell: pwsh
        run: |
          @'
          owner: Agrysif
          repo: WatchTwitch
          provider: github
          releaseType: draft
          updaterCacheDirName: watchtwitch-updater
          '@ | Set-Content dist/audit-old-app-update.yml
          node tests/verify-release.cjs
      - run: node tests/run-electron.cjs tests/update-forward.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: WatchTwitch-1.3.2
          path: |
            dist/WatchTwitch-Setup-1.3.2.exe
            dist/WatchTwitch-Setup-1.3.2.exe.blockmap
            dist/latest.yml

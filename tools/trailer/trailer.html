<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WatchTwitch trailer</title>
<!--
  Трейлер WatchTwitch. Каждый кадр строится функцией render(t) из времени —
  без CSS-анимаций и таймеров, поэтому рендер покадровый и повторяемый
  (render.cjs снимает кадры и собирает видео ffmpeg).
  Сетка — 140 BPM трека: такт 1,714 с, доли от 0,01 с.
-->
<style>
@font-face { font-family: 'Plex Mono'; font-weight: 400; src: url(../../assets/fonts/IBMPlexMono-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Plex Mono'; font-weight: 500; src: url(../../assets/fonts/IBMPlexMono-500-latin.woff2) format('woff2'); }

:root {
  --violet: #7C5CFF;
  --violet-hi: #B39CFF;
  --lime: #C8FF2E;
  --ink: #050507;
  --paper: #F4F4F6;
  --mute: #8C8C9C;
}

html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
#stage > * { position: absolute; inset: 0; }
canvas { position: absolute; left: 0; top: 0; }

#world { perspective: 1700px; perspective-origin: 50% 48%; }
.g3 { position: absolute; left: 960px; top: 540px; width: 0; height: 0; transform-style: preserve-3d; }
.slab {
  position: absolute; background-repeat: no-repeat; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1.5px rgba(186, 164, 255, .9), 0 0 26px rgba(124, 92, 255, .6), 0 0 90px rgba(124, 92, 255, .32);
}
.slab::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(100deg,
    transparent calc(var(--scan, -30%) - 14%),
    rgba(150, 120, 255, .22) calc(var(--scan, -30%) - 1%),
    rgba(235, 228, 255, .7) var(--scan, -30%),
    transparent calc(var(--scan, -30%) + .7%));
}
.slab .dim { position: absolute; inset: 0; background: var(--ink); opacity: 0; }
.tag3 {
  position: absolute; white-space: nowrap; font: 500 20px/1 'Plex Mono', Consolas, monospace; letter-spacing: .06em;
  color: #0A0A0C; background: var(--lime); padding: 8px 12px 7px; box-shadow: 6px 6px 0 var(--violet);
}

.t {
  position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--paper);
  font-family: Bahnschrift, 'Segoe UI', sans-serif; font-weight: 700; font-stretch: condensed;
  line-height: .84; letter-spacing: -.005em; text-transform: uppercase; transform-origin: 0 50%;
}
.m {
  position: absolute; left: 0; top: 0; white-space: pre; font: 500 18px/1.3 'Plex Mono', Consolas, monospace;
  letter-spacing: .08em; color: var(--mute); text-transform: uppercase;
}
.m b { color: var(--lime); font-weight: 500; }
.m i { color: var(--paper); font-style: normal; }
.blk {
  position: absolute; left: 0; top: 0; white-space: nowrap; background: var(--lime); color: #0A0A0C;
  font-family: Bahnschrift, sans-serif; font-weight: 700; font-stretch: condensed; text-transform: uppercase;
  line-height: .9; padding: .1em .2em .02em; box-shadow: 14px 14px 0 var(--violet); transform-origin: 0 50%;
}
.box {
  position: absolute; left: 0; top: 0; box-sizing: border-box; border: 3px solid var(--paper);
  background: #0B0B11; box-shadow: 10px 10px 0 var(--violet);
}
.box .m { position: absolute; }
.box .t { position: absolute; }
.outline { color: transparent; -webkit-text-stroke: 2px rgba(244, 244, 246, .07); }

#flash { background: #fff; opacity: 0; }
#tint { background: radial-gradient(ellipse at 50% 55%, rgba(124, 92, 255, .55), rgba(124, 92, 255, 0) 70%); opacity: 0; mix-blend-mode: screen; }
#lines { background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; opacity: .55; }
#vig { background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0, 0, 0, .7) 100%); }
#black { background: #000; opacity: 0; }
#grain { mix-blend-mode: overlay; opacity: .16; }
#mark { position: absolute; left: 0; top: 0; inset: auto; width: 16px; height: 1px; image-rendering: pixelated; }
.scene { position: absolute; inset: 0; display: none; }
.scene.g3wrap { transform-style: preserve-3d; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="world"></div>
  <canvas id="hud" width="1920" height="1080"></canvas>
  <div id="type"></div>
  <div id="tint"></div>
  <div id="flash"></div>
  <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="lines"></div>
  <div id="vig"></div>
  <div id="black"></div>
  <canvas id="mark" width="16" height="1"></canvas>
</div>
<script src="assets/env.js"></script>
<script>
'use strict';
// ─── время и ритм ───────────────────────────────────────────────────
const W = 1920, H = 1080;
const DURATION = 32.4;
const B = 60 / 140, T0 = 0.01;
const beat = n => T0 + n * B;
const bar = k => beat(4 * k);

// Тики вступления и бочки — из разбора трека (tools/trailer/README)
const TICKS = [0.34, 0.66, 0.98, 1.2, 1.52, 1.94, 2.16, 2.48, 2.8];
const BUILD_ONSETS = [6.66, 6.98, 7.2, 7.52, 7.84, 8.16, 8.38, 8.7, 9.02, 9.34];
const ROLL = Array.from({ length: 15 }, (_, i) => 13.94 + i * (B / 2));
const beatsIn = (a, b) => { const out = []; for (let n = 0; n < 80; n++) { const x = beat(n); if (x >= a - 1e-6 && x < b - 1e-6) out.push(x); } return out; };
const KICKS = [3.01, 3.46, 3.9, ...BUILD_ONSETS, ...beatsIn(10.29, 13.7), ...beatsIn(17.15, 24.0), 27.01, ...beatsIn(27.43, 30.86), 30.867];
const BIG = [3.01, 10.296, 17.153, 27.01, 30.867];
const CUTS = [3.01, 10.296, 11.153, 12.01, 12.867, 17.153, 18.867, 20.581, 22.296, 27.01, 27.439, 29.153, 30.867];

// ─── математика ─────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: x => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOut: x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuart: x => 1 - Math.pow(1 - x, 4),
};
const hit = (t, list, k) => { let s = 0; for (const h of list) if (t >= h) s = Math.max(s, Math.exp(-(t - h) * k)); return s; };
// Ключевые кадры: [[t, v], ...] — линейно между ними
const kf = (t, keys) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; return lerp(va, vb, E.inOut((t - a) / (b - a))); }
  }
  return keys[keys.length - 1][1];
};
function rng(seed) {
  let a = seed | 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
const hash = (n) => rng(n * 9301 + 49297)();
const env = (arr, t) => { const i = t / ENV.hop; const a = Math.floor(i); return lerp(arr[a] || 0, arr[a + 1] || 0, i - a); };
const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, '0');
const fmt = n => Math.round(n).toLocaleString('en-US');

// ─── DOM ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const world = $('world'), typeLayer = $('type');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function sceneRoot(parent) { return el('div', 'scene', parent); }
function g3(parent) { return el('div', 'g3', parent); }

const SHOT = { w: 1440, h: 900 };
const CROPS = {
  player: { x: 258, y: 121, w: 642, h: 361 },
  info: { x: 905, y: 116, w: 490, h: 204 },
  next: { x: 914, y: 240, w: 479, h: 80 },
  points: { x: 912, y: 329, w: 483, h: 82 },
  infoPoints: { x: 905, y: 116, w: 490, h: 296 },
  rewards: { x: 258, y: 592, w: 645, h: 144 },
  rewardsAll: { x: 250, y: 508, w: 1148, h: 262 },
  card: { x: 17, y: 659, w: 192, h: 178 },
  nav: { x: 9, y: 34, w: 208, h: 268 },
  dropCards: { x: 240, y: 140, w: 1170, h: 258 },
  dropCard: { x: 240, y: 140, w: 580, h: 258 },
  favs: { x: 242, y: 200, w: 600, h: 210 },
  timeline: { x: 242, y: 190, w: 1166, h: 330 },
  statsTop: { x: 240, y: 102, w: 1170, h: 312 },
};
function slab(parent, shot, crop, scale, opts = {}) {
  const c = crop || { x: 0, y: 0, w: SHOT.w, h: SHOT.h };
  const d = el('div', 'slab', parent);
  const w = c.w * scale, h = c.h * scale;
  Object.assign(d.style, {
    width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px',
    backgroundImage: `url(assets/shots/${shot}.png)`,
    backgroundSize: `${SHOT.w * scale}px ${SHOT.h * scale}px`,
    backgroundPosition: `${-c.x * scale}px ${-c.y * scale}px`,
    borderRadius: (opts.radius ?? 16) + 'px',
  });
  d.dim = el('div', 'dim', d);
  d.cw = w; d.ch = h;
  return d;
}
function tf(e, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1, o = 1 } = {}) {
  e.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  e.style.opacity = o;
}
function pos(e, x, y, { s = 1, o = 1, sk = 0, r = 0 } = {}) {
  e.style.transform = `translate(${x}px,${y}px) scale(${s}) skewX(${sk}deg) rotate(${r}deg)`;
  e.style.opacity = o;
}
// Появление «с размаху»: масштаб с перелётом, дрожь первые кадры
function slam(e, t, at, x, y, { from = 1.35, dur = .2, jitter = 10, r = 0 } = {}) {
  if (t < at) { e.style.opacity = 0; return; }
  const k = p(t, at, at + dur);
  const s = lerp(from, 1, E.outExpo(k));
  const j = (1 - k) * jitter;
  const f = Math.floor(t * 60);
  pos(e, x + (hash(f) - .5) * j, y + (hash(f + 7) - .5) * j, { s, o: clamp(k * 4), r });
}
// Шторка слева направо через clip-path
function wipe(e, t, at, dur = .25, out = null) {
  let c = 100 - 100 * E.outExpo(p(t, at, at + dur));
  let top = 0, bottom = 0;
  if (out != null && t > out) { const k = E.inExpo(p(t, out, out + .18)); top = bottom = 50 * k; }
  e.style.clipPath = `inset(${top}% ${c}% ${bottom}% 0)`;
  e.style.opacity = t < at ? 0 : 1;
}
// Уход «нарезкой»: схлопывание по высоте
function sliceOut(e, t, at, dur = .18) {
  if (t < at) return;
  const k = E.inExpo(p(t, at, at + dur));
  e.style.clipPath = `inset(${50 * k}% 0 ${50 * k}% 0)`;
}
function typeOn(e, full, t, at, cps = 90) {
  const n = Math.max(0, Math.floor((t - at) * cps));
  e.textContent = full.slice(0, n);
  e.style.opacity = t < at ? 0 : 1;
}

// ─── canvas ─────────────────────────────────────────────────────────
const bg = $('bg').getContext('2d');
const hud = $('hud').getContext('2d');
const grainCtx = $('grain').getContext('2d');
const MONO = "500 18px 'Plex Mono', Consolas, monospace";
const VIOLET = 'rgba(124,92,255,', LIME = '#C8FF2E';

function glowLine(ctx, pts, color, width = 2, blur = 14) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  ctx.restore();
}
function brackets(ctx, x, y, w, h, len, color, width = 2, blur = 10) {
  const L = len;
  [[x, y + L, x, y, x + L, y], [x + w - L, y, x + w, y, x + w, y + L], [x + w, y + h - L, x + w, y + h, x + w - L, y + h], [x + L, y + h, x, y + h, x, y + h - L]]
    .forEach(([a, b, c, d, e, f]) => glowLine(ctx, [[a, b], [c, d], [e, f]], color, width, blur));
}
function mono(ctx, text, x, y, { size = 18, color = '#8C8C9C', align = 'left', alpha = 1, weight = 500 } = {}) {
  ctx.save();
  ctx.shadowBlur = 0; ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = `${weight} ${size}px 'Plex Mono', Consolas, monospace`;
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = (size * .08) + 'px';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function ring(ctx, x, y, r, prog, { color = 'rgba(179,156,255,1)', width = 6, ticks = 60, rot = 0, alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = width;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2 + rot, -Math.PI / 2 + rot + Math.PI * 2 * prog); ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < ticks; i++) {
    const a = rot + i / ticks * Math.PI * 2, r1 = r + width + 6, r2 = r1 + (i % 5 ? 5 : 12);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); ctx.stroke();
  }
  ctx.restore();
}
function barcode(ctx, x, y, w, h, seed, alpha = .8) {
  const r = rng(seed);
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#F4F4F6';
  let cx = x;
  while (cx < x + w) { const bw = 1 + Math.floor(r() * 4); if (r() > .45) ctx.fillRect(cx, y, bw, h); cx += bw + 1 + Math.floor(r() * 3); }
  ctx.restore();
}
function eq(ctx, x, y, w, h, t, n = 48, alpha = .9) {
  ctx.save(); ctx.globalAlpha = alpha;
  const bw = w / n;
  for (let i = 0; i < n; i++) {
    const lag = i * .012;
    const v = clamp(env(ENV.rms, Math.max(0, t - lag)) * (.55 + .45 * Math.sin(i * 1.7 + t * 9) ** 2) * 1.25);
    const bh = Math.max(2, v * h);
    ctx.fillStyle = i % 6 === 0 ? LIME : 'rgba(179,156,255,.9)';
    ctx.fillRect(x + i * bw, y - bh, bw * .55, bh);
  }
  ctx.restore();
}
function hexColumn(ctx, x, y, rows, t, seed, alpha = .35) {
  const r = rng(seed + Math.floor(t * 12));
  for (let i = 0; i < rows; i++) {
    const s = Array.from({ length: 4 }, () => '0123456789ABCDEF'[Math.floor(r() * 16)]).join('');
    mono(hud, `${s} ${(r() * 99).toFixed(2).padStart(5, '0')}`, x, y + i * 24, { size: 14, alpha: alpha * (i === rows - 1 ? 1 : .6), color: i % 7 === 3 ? LIME : '#8C8C9C' });
  }
}

// Затемнение слева, чтобы крупный текст читался поверх экранов приложения
function shade(a) {
  if (a <= 0) return;
  const g = hud.createLinearGradient(0, 0, 1250, 0);
  g.addColorStop(0, `rgba(5,5,7,${a})`); g.addColorStop(.55, `rgba(5,5,7,${a * .7})`); g.addColorStop(1, 'rgba(5,5,7,0)');
  hud.fillStyle = g; hud.fillRect(0, 0, 1250, H);
}

// Зерно: несколько плиток шума, каждый кадр — своя
const grainTiles = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement('canvas'); c.width = 960; c.height = 540;
  const g = c.getContext('2d'); const img = g.createImageData(960, 540); const r = rng(1000 + k);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); grainTiles.push(c);
}

// ─── фон: сетка-пол, свечение, пыль ─────────────────────────────────
const dust = Array.from({ length: 140 }, (_, i) => { const r = rng(500 + i); return { x: r() * W, y: r() * H, z: .2 + r() * .8, s: r() }; });
function mood(t) {
  return {
    grid: kf(t, [[0, 0], [1.2, .18], [2.9, .25], [3.05, .75], [5, .4], [9.8, .55], [10.3, .85], [13.6, .6], [13.8, .3], [16.9, .45], [17.0, 0], [17.15, .95], [23.9, .8], [24.1, .2], [26.6, .35], [27.0, .95], [30.6, .8], [30.9, .5], [32.4, .2]]),
    speed: kf(t, [[0, .15], [3, .3], [9.5, .9], [10.3, 1.6], [13.7, .9], [16.9, 2.2], [17.15, 1.8], [24, .25], [26.8, 1.2], [27, 2], [30.9, .4]]),
    bloom: kf(t, [[0, 0], [2.9, .15], [3.05, .9], [5, .45], [10, .6], [10.3, 1], [13.7, .45], [16.9, .7], [17.0, 0], [17.15, 1], [24, .9], [24.1, .25], [27, 1], [30.9, .7], [32.4, 0]]),
    horizon: kf(t, [[0, 640], [17, 640], [17.15, 610], [24, 610], [24.1, 700], [27, 610]]),
  };
}
let gridScroll = 0, lastT = 0;
function drawBg(t) {
  const m = mood(t);
  bg.fillStyle = '#050507'; bg.fillRect(0, 0, W, H);
  const low = env(ENV.low, t);
  const pulse = hit(t, KICKS, 7) * .5 + low * .35;
  // свечение за сценой
  const b = clamp(m.bloom * (.55 + pulse));
  if (b > .01) {
    const g = bg.createRadialGradient(960, 560, 0, 960, 560, 1000);
    g.addColorStop(0, `rgba(124,92,255,${.34 * b})`); g.addColorStop(.45, `rgba(90,60,220,${.12 * b})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  }
  // пол-сетка в перспективе
  const hy = m.horizon, ga = m.grid * (.75 + pulse * .5);
  if (ga > .01) {
    bg.save();
    bg.strokeStyle = `rgba(124,92,255,${.55 * ga})`; bg.lineWidth = 1.2; bg.shadowColor = 'rgba(124,92,255,.9)'; bg.shadowBlur = 8;
    bg.beginPath();
    for (let i = -24; i <= 24; i++) { bg.moveTo(960 + i * 26, hy); bg.lineTo(960 + i * 420, H + 40); }
    const scroll = (t * m.speed * .9) % 1;
    for (let k = 0; k < 22; k++) {
      const z = 22 - k - scroll; // дальше — меньше
      const y = hy + 520 / z;
      if (y > H + 10) continue;
      bg.moveTo(0, y); bg.lineTo(W, y);
    }
    bg.stroke();
    // горизонт
    const hg = bg.createLinearGradient(0, hy - 60, 0, hy + 30);
    hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(.7, `rgba(150,120,255,${.25 * ga})`); hg.addColorStop(1, 'rgba(0,0,0,0)');
    bg.shadowBlur = 0; bg.fillStyle = hg; bg.fillRect(0, hy - 60, W, 90);
    // затемнение к горизонту
    const fade = bg.createLinearGradient(0, hy, 0, hy + 260);
    fade.addColorStop(0, 'rgba(5,5,7,.92)'); fade.addColorStop(1, 'rgba(5,5,7,0)');
    bg.fillStyle = fade; bg.fillRect(0, hy, W, 260);
    bg.restore();
  }
  // пыль, летит вверх и к зрителю
  bg.save();
  for (const d of dust) {
    const sp = m.speed * (30 + d.z * 120);
    const y = ((d.y - t * sp) % H + H) % H;
    const a = (.15 + d.z * .45) * clamp(t / 1.5);
    bg.fillStyle = d.s > .9 ? `rgba(200,255,46,${a})` : `rgba(190,175,255,${a})`;
    const sz = .8 + d.z * 1.8;
    bg.fillRect(d.x, y, sz, sz * (1 + m.speed * d.z * 2.2));
  }
  bg.restore();

// ─── постоянный HUD рамки ───────────────────────────────────────────

// ─── кадр ───────────────────────────────────────────────────────────
// Метка номера кадра в левом верхнем углу: рендерер по ней понимает, что
// снят именно этот кадр, а не предыдущий (и затирает её перед записью)
const markCtx = $("mark").getContext("2d");
function mark(id) {
  for (let i = 0; i < 16; i++) { markCtx.fillStyle = (id >> i) & 1 ? "#fff" : "#000"; markCtx.fillRect(i, 0, 1, 1); }
}

function render(t, id = 0) {
  mark(id);
  t = clamp(t, 0, DURATION);
  hud.clearRect(0, 0, W, H);
  drawBg(t);
  for (const s of SCENES) {
    const on = t >= s.a && t < s.b;
    s.roots.forEach(r => { r.style.display = on ? 'block' : 'none'; });
    if (on) s.update(t);
  }
  drawFrameHud(t);
  // тряска камеры на ударах
  const f = Math.floor(t * 60);
  const shake = hit(t, BIG, 7) * 16 + hit(t, CUTS, 12) * 7 + hit(t, KICKS, 16) * 2.5;
  const sx = (hash(f * 3 + 1) - .5) * shake, sy = (hash(f * 3 + 2) - .5) * shake;
  const zoom = 1 + hit(t, KICKS, 10) * .006 + hit(t, BIG, 6) * .02;
  const camT = `translate(${sx}px,${sy}px) scale(${zoom})`;
  world.style.transform = camT; typeLayer.style.transform = camT; $('hud').style.transform = camT;
  // хроматическое расслоение в момент склейки
  const ch = hit(t, CUTS, 14);
  const split = ch > .04 ? `drop-shadow(${8 * ch}px 0 0 rgba(255,40,90,.6)) drop-shadow(${-8 * ch}px 0 0 rgba(40,220,255,.6))` : 'none';
  world.style.filter = split; typeLayer.style.filter = split;
  $('flash').style.opacity = clamp(hit(t, BIG, 11) * .55 + hit(t, CUTS.filter(c => !BIG.includes(c)), 16) * .28);
  $('tint').style.opacity = clamp(hit(t, KICKS, 6) * .3 + hit(t, BIG, 4) * .35);
  $('black').style.opacity = Math.max(1 - clamp(t / .12), p(t, 32.1, 32.4));
  // зерно
  grainCtx.clearRect(0, 0, W, H);
  grainCtx.globalAlpha = 1;
  grainCtx.drawImage(grainTiles[f % grainTiles.length], 0, 0, W, H);
  lastT = t;
}

window.DURATION = DURATION;
window.render = render;
window.ready = (async () => {
  await document.fonts.load("700 100px Bahnschrift");
  await document.fonts.load("500 18px 'Plex Mono'");
  await document.fonts.ready;
  const urls = ['farming', 'drops', 'calendar', 'subscriptions', 'statistics', 'settings', 'drop-details', 'category-details', 'accounts'].map(s => `assets/shots/${s}.png`).concat(['../../assets/icon-256.png']);
  await Promise.all(urls.map(u => { const i = new Image(); i.src = u; return i.decode().catch(() => null); }));
  render(0);
  return true;
})();

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Политика безопасности: скрипты и стили только свои, картинки и
       запросы — только по https. Внешних скриптов у страницы нет. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: data:; media-src 'self' https: blob:; frame-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv; child-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv;">
  <title>WatchTwitch</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/animations.css">
</head>
<body class="theme-dark">
  <!-- Custom Title Bar -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <img src="../assets/logo.svg" alt="Logo" class="titlebar-logo">
      <span class="titlebar-title">WatchTwitch</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-button" id="minimize-btn">
        <svg width="12" height="2" viewBox="0 0 12 2">
          <rect width="12" height="2" fill="currentColor"/>
        </svg>
      </button>
      <button class="titlebar-button" id="maximize-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect width="12" height="12" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="titlebar-button close" id="close-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="sidebar-top">
        <button class="nav-item active" data-page="farming">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
            <path fill="currentColor" d="M10 2L2 7v11h6v-6h4v6h6V7l-8-5z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.farming">Фарминг</span>
        </button>
        
        <button class="nav-item" data-page="accounts">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
            <path fill="currentColor" d="M10 2a4 4 0 100 8 4 4 0 000-8zm-7 12a7 7 0 1114 0v2H3v-2z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.accounts">Аккаунты</span>
        </button>
        
        <button class="nav-item" data-page="drops">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
            <path fill="currentColor" d="M10 1l3.09 6.26L20 8.27l-5 4.87 1.18 6.88L10 16.77l-6.18 3.25L5 13.14 0 8.27l6.91-1.01L10 1z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.drops">Дропсы</span>
        </button>
        
        <button class="nav-item" data-page="subscriptions">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
            <path fill="currentColor" d="M10 12a2 2 0 100-4 2 2 0 000 4zm6-7H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 12H4V7h12v10z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.subscriptions">Подписки</span>
        </button>
        
        <button class="nav-item" data-page="calendar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
          <span>Календарь</span>
        </button>
        <button class="nav-item" data-page="statistics">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
            <path fill="currentColor" d="M2 2h4v16H2V2zm6 4h4v12H8V6zm6 6h4v6h-4v-6z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.statistics">Статистика</span>
        </button>
        
        <button class="nav-item" data-page="settings">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          <span class="nav-text" data-i18n="nav.settings">Настройки</span>
          <div id="update-notification-badge" class="update-notification-badge" style="display: none;" title="Обновление готово к установке">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
          </div>
        </button>
      </div>

      <!-- Farming Controls -->
      <div class="sidebar-farming">
        <!-- Mini Twitch Player (16:9) - показывается когда активна сессия и не на странице фарминга -->
        <div id="sidebar-mini-player-container" style="display: none; margin-bottom: 8px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease;">
          <!-- Слот для того же самого постоянного плеера, что и на странице фарминга -->
          <div id="sidebar-player-slot" style="position: relative; width: 100%; padding-bottom: 56.25%; background: #000;"></div>
        </div>
        
        <!-- Mini Drops Progress -->
        <div id="sidebar-drops-progress" style="display: none; position: relative; padding: 12px 14px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 6px; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="#7c5cff">
                <path d="M8 2L10 6H14L11 9L12 13L8 10.5L4 13L5 9L2 6H6L8 2Z"/>
              </svg>
              <span style="font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;" data-i18n="sidebar.dropsProgress">Дропсы</span>
            </div>
            <span id="sidebar-drops-percent" style="font-size: 16px; font-weight: 700; color: var(--text-primary);">0%</span>
          </div>
          <div class="drops-track">
            <div id="sidebar-drops-bar" style="height: 100%; background: #7c5cff; width: 0%; transition: width 0.5s ease;"></div>
            <div id="sidebar-drops-marks" class="drops-marks"></div>
          </div>
          <div id="sidebar-drops-credit" class="drops-credit" data-state="waiting">
            <span class="drops-credit-dot"></span>
            <span id="sidebar-drops-credit-text">Жду зачёт от Twitch</span>
          </div>
          <div id="sidebar-drops-tip" class="drops-tip" role="tooltip" aria-hidden="true"></div>
        </div>
        
        <div id="login-badge" class="game-mode-badge login-badge" hidden role="button" title="Нажмите, чтобы войти в Twitch">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4M12 16h.01"/>
          </svg>
          <span>Нет входа в Twitch</span>
        </div>
        <div id="game-mode-badge" class="game-mode-badge" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>
            <path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.6l-.7 7A3 3 0 0 0 5 19a3 3 0 0 0 2.4-1.2L9 16h6l1.6 1.8A3 3 0 0 0 19 19a3 3 0 0 0 3-3.4l-.7-7A4 4 0 0 0 17.32 5z"/>
          </svg>
          <span id="game-mode-text"></span>
        </div>
        <div id="farming-session-info" style="display: none; padding: 16px; background: var(--bg-secondary); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border-color); opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease;">
          <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;" data-i18n="sidebar.session">Сессия</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 6px; height: 6px; background: #35d08a; border-radius: var(--radius-circle); animation: pulse 2s infinite;"></div>
              <span class="session-status" style="font-size: 12px; color: var(--text-secondary);" data-i18n="sidebar.active">Активна</span>
              <span class="session-auto-badge" style="display: none; padding: 2px 6px; background: rgba(255, 152, 0, 0.15); color: #ff9800; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; text-transform: uppercase;" data-i18n="sidebar.auto">Авто</span>
            </div>
            <div style="font-size: 13px; color: var(--text-primary); font-weight: 600;" id="session-duration">00:00:00</div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; border-top: 1px solid var(--border-color);">
              <span style="font-size: 11px; color: var(--text-secondary);" data-i18n="sidebar.traffic">Трафик</span>
              <span style="display: flex; align-items: baseline; gap: 6px;">
                <span id="session-traffic-value" style="font-size: 12px; font-weight: 600; color: var(--text-primary);">0 Б</span>
                <span id="session-traffic-rate" style="font-size: 10px; color: var(--text-tertiary);">0 КБ/с</span>
              </span>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" id="sidebar-start-farming-btn" style="width: 100%; justify-content: center; padding: 14px 20px; opacity: 1; transform: scale(1); transition: opacity 0.2s ease, transform 0.2s ease;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 2l10 6-10 6V2z"/>
          </svg>
          <span data-i18n="farming.startFarming">Начать фарминг</span>
        </button>
        <button class="btn btn-secondary" id="sidebar-to-autofarm-btn" style="width: 100%; justify-content: center; padding: 11px 20px; display: none; margin-bottom: 8px;" title="Категория запущена вручную и не переключается сама. Нажмите, чтобы приложение продолжило автоматически">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/>
            <path d="M20 4v4h-4"/>
            <path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/>
            <path d="M4 20v-4h4"/>
          </svg>
          <span>Переключить на автофарм</span>
        </button>
        <button class="btn btn-danger" id="sidebar-stop-farming-btn" style="width: 100%; justify-content: center; padding: 14px 20px; display: none; opacity: 0; transform: scale(0.95); transition: opacity 0.2s ease, transform 0.2s ease;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="3" y="3" width="10" height="10"/>
          </svg>
          <span data-i18n="farming.stopFarming">Остановить</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="content">
      <!-- Pages will be loaded here -->
      <div id="page-container"></div>
    </main>
  </div>

  <!-- Фоновый плеер удалён намеренно: раньше поток копировался между тремя
       webview через .src, и каждое такое копирование перезапускало стрим.
       Теперь плеер один и создаётся в player-manager.js. -->

  <!-- Scripts -->
  <!-- Core modules - загружаем первыми -->
  <script src="js/core/session-state.js"></script>
  <!-- SlottedWebview должен идти до наследников -->
  <script src="js/core/slotted-webview.js"></script>
  <script src="js/core/player-manager.js"></script>
  <script src="js/core/chat-manager.js"></script>
  <script src="js/core/shutdown-manager.js"></script>
  <script src="js/core/whats-new.js"></script>
  <script src="js/core/favourites-watch.js"></script>
  <script src="js/core/login-guard.js"></script>
  <script src="js/core/notification-service.js"></script>
  <script src="js/core/settings-manager.js"></script>
  <script src="js/core/tooltip-service.js"></script>
  <script src="js/core/title-manager.js"></script>
  
  <!-- Utils - утилиты -->
  <script src="js/utils/date-helpers.js"></script>
  <script src="js/utils/dom-helpers.js"></script>
  
  <!-- Features - функционал -->
  <script src="js/features/farming/bonus-collector-script.js"></script>
  <script src="js/core/network-limit.js"></script>
  <script src="js/core/game-mode.js"></script>
  <script src="js/core/csv-export.js"></script>
  <script src="js/core/quiet-hours.js"></script>
  <script src="js/core/chime.js"></script>
  <script src="js/core/ics-export.js"></script>
  <script src="js/core/backup.js"></script>
  <script src="js/core/traffic-estimate.js"></script>
  <script src="js/features/farming/campaign-value.js"></script>
  <script src="js/features/calendar/campaign-calendar.js"></script>
  <script src="js/features/calendar/campaign-history.js"></script>
  <script src="js/features/calendar/missed-drops.js"></script>
  <script src="js/features/farming/stream-picker.js"></script>
  <script src="js/features/farming/drop-credit.js"></script>
  <script src="js/features/farming/viewers-chart.js"></script>
  <script src="js/features/farming/category-details-modal.js"></script>
  
  <!-- Legacy modules -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/streaming.js"></script>
  
  <!-- Pages -->
  <script src="js/pages/accounts-page.js"></script>
  <script src="js/pages/farming-page.js"></script>
  <script src="js/pages/subscriptions-page.js"></script>
  <script src="js/pages/statistics-page.js"></script>
  <script src="js/pages/settings-page.js"></script>
  <script src="js/updater.js"></script>
  <!-- Окно обновления строит updater.js сам: вторая копия разметки с теми
       же id лежала здесь и перехватывала стили и обращения по id -->
  <!-- Router & App -->
  <script src="js/router.js"></script>
  <script src="js/pages/calendar-page.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

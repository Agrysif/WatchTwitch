<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Политика безопасности: скрипты и стили только свои, картинки и
       запросы — только по https. Внешних скриптов у страницы нет. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: data:; media-src 'self' https: blob:; frame-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv; child-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv;">
  <title>WatchTwitch</title>
  <!-- Порядок важен: токены (themes.css) идут после основы, правила
       страниц — после общих компонентов, чтобы перекрывать их без
       !important; оформление iOS 27 — последним -->
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/page-farming.css">
  <link rel="stylesheet" href="styles/page-drops.css">
  <link rel="stylesheet" href="styles/page-subscriptions.css">
  <link rel="stylesheet" href="styles/page-stats.css">
  <link rel="stylesheet" href="styles/page-settings.css">
  <link rel="stylesheet" href="styles/notifications.css">
  <!-- Оформление «iOS 27»: все правила под body.ui-ios27, без класса не
       действует ни одно — классика от подключения не меняется -->
  <link rel="stylesheet" href="styles/theme-ios27.css">
</head>
<body class="theme-dark">
  <!-- Заголовок окна -->
  <div class="titlebar">
    <div class="titlebar-drag">
      <img src="../assets/logo.svg" alt="" class="titlebar-logo">
      <span class="titlebar-title">WatchTwitch</span>
    </div>
    <!-- Инструменты заголовка не перетаскивают окно. Обработчик журнала
         вешает event-log-ui.js -->
    <div class="titlebar-tools">
      <button class="titlebar-button titlebar-journal" id="journal-btn" title="Журнал событий" aria-label="Журнал событий">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M9 8h6M9 12h6M9 16h4"/>
        </svg>
        <span id="journal-badge" class="titlebar-badge" hidden></span>
      </button>
    </div>
    <div class="titlebar-controls">
      <!-- data-no-tr: «Свернуть» в словаре — кнопка списков, подпись этой
           кнопки на английском ставит app.js -->
      <button class="titlebar-button" id="minimize-btn" title="Свернуть" aria-label="Свернуть" data-no-tr>
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0 5h10" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="titlebar-button" id="maximize-btn" title="Развернуть" aria-label="Развернуть">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="titlebar-button close" id="close-btn" title="Закрыть" aria-label="Закрыть">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1.1"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="app-container">
    <!-- Сайдбар -->
    <nav class="sidebar" aria-label="Разделы">
      <div class="sidebar-top">
        <!-- Порядок по частоте: то, что смотрят во время фарминга, — сверху;
             аккаунты и настройки — отдельной группой внизу -->
        <div class="nav-group">
          <button class="nav-item active" data-page="farming">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M12 17v4M8 21h8"/>
              <path d="M10 7.75v4.5a.5.5 0 0 0 .76.43l3.6-2.25a.5.5 0 0 0 0-.86l-3.6-2.25a.5.5 0 0 0-.76.43z"/>
            </svg>
            <span class="nav-text">Фарминг</span>
          </button>

          <button class="nav-item" data-page="drops">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="8" width="18" height="4" rx="1"/>
              <path d="M12 8v13"/>
              <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
              <path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
            </svg>
            <span class="nav-text">Дропсы</span>
          </button>

          <button class="nav-item" data-page="calendar">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            <span class="nav-text">Календарь</span>
          </button>

          <button class="nav-item" data-page="subscriptions">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/>
            </svg>
            <span class="nav-text">Подписки</span>
          </button>

          <button class="nav-item" data-page="statistics">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
              <path d="M18 17V9M13 17V5M8 17v-3"/>
            </svg>
            <span class="nav-text">Статистика</span>
          </button>
        </div>

        <div class="nav-divider" role="separator"></div>

        <div class="nav-group">
          <button class="nav-item" data-page="accounts">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="10" r="3"/>
              <path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"/>
            </svg>
            <span class="nav-text">Аккаунты</span>
          </button>

          <button class="nav-item" data-page="settings">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="nav-text">Настройки</span>
            <span id="update-notification-badge" class="update-notification-badge" style="display: none;" title="Обновление готово к установке"></span>
          </button>
        </div>
      </div>

      <!-- Блок фарминга: одна карточка с разделами и кнопка под ней.
           Видимость частей пишет JS: style.display у мини-плеера, сессии,
           дропсов и кнопок, атрибут hidden у значков — механизм прежний.
           В style здесь только то, что JS меняет; остальное — в main.css -->
      <div class="sidebar-farming">
        <!-- Мини-плеер: слот того же постоянного плеера, что на странице
             фарминга; показывает роутер на остальных страницах -->
        <div id="sidebar-mini-player-container" style="display: none; opacity: 0; transform: translateY(-10px);">
          <div id="sidebar-player-slot"></div>
        </div>

        <div class="farm-card" id="farm-card">
          <!-- Сессия: показывает и прячет session-state.js. Строку статуса
               и пояснение пишет farm-status.js -->
          <div id="farming-session-info" class="farm-card-section" style="display: none; opacity: 0; transform: translateY(-10px);">
            <div class="farm-card-row">
              <span class="status-dot is-live" id="farm-status-dot" aria-hidden="true"></span>
              <span class="farm-card-status session-status" id="farm-status-text" aria-live="polite">Фарминг идёт</span>
              <span class="farm-card-timer num" id="session-duration" title="Длительность сессии">00:00:00</span>
            </div>
            <div class="farm-card-row farm-card-sub">
              <span class="farm-card-detail truncate" id="farm-status-detail"></span>
              <span class="farm-card-traffic num" title="Трафик за сессию"><span id="session-traffic-value">0 Б</span><span id="session-traffic-rate" class="visually-hidden">0 КБ/с</span></span>
            </div>
          </div>

          <!-- Награды: показывает и прячет farming-page.js -->
          <div id="sidebar-drops-progress" class="farm-card-section" style="display: none; opacity: 0; transform: translateY(-10px);">
            <div class="farm-card-row">
              <span class="farm-card-label">Дропсы</span>
              <span id="sidebar-drops-percent" class="farm-card-percent num">0%</span>
            </div>
            <div class="drops-track">
              <div id="sidebar-drops-bar"></div>
              <div id="sidebar-drops-marks" class="drops-marks"></div>
            </div>
            <!-- Следующая награда — видна всегда, а не по наведению -->
            <div id="sidebar-drops-tip" class="drops-tip" role="status" aria-hidden="true"></div>
            <div id="sidebar-drops-credit" class="drops-credit" data-state="waiting">
              <span class="drops-credit-dot"></span><span id="sidebar-drops-credit-text">Жду зачёт от Twitch</span>
            </div>
          </div>

          <div id="login-badge" class="farm-card-alert is-danger game-mode-badge login-badge" hidden role="button" tabindex="0" title="Нажмите, чтобы войти в Twitch">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M17 8l5 5M22 8l-5 5"/>
            </svg>
            <span>Нет входа в Twitch</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>
          <div id="game-mode-badge" class="farm-card-alert game-mode-badge" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/>
              <path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/>
            </svg>
            <span id="game-mode-text"></span>
          </div>
        </div>

        <button class="btn btn-primary btn-lg btn-block" id="sidebar-start-farming-btn" style="opacity: 1; transform: scale(1);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/>
          </svg>
          <span>Начать фарминг</span>
        </button>
        <!-- Видимость кнопки — в style="display: …": по нему main.css решает,
             хватает ли места мини-плееру. Не переносить в класс -->
        <button class="btn btn-ghost btn-sm btn-block" id="sidebar-to-autofarm-btn" style="display: none;" title="Категория запущена вручную и не переключается сама. Нажмите, чтобы приложение снова выбирало категории само">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          <span>Вернуть автовыбор</span>
        </button>
        <button class="btn btn-secondary btn-lg btn-block btn-stop" id="sidebar-stop-farming-btn" style="display: none; opacity: 0; transform: scale(0.95);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
          <span>Остановить</span>
        </button>
      </div>
    </nav>

    <!-- Область страниц -->
    <main class="content">
      <div id="page-container"></div>
    </main>
  </div>

  <!-- Фоновый плеер удалён намеренно: раньше поток копировался между тремя
       webview через .src, и каждое такое копирование перезапускало стрим.
       Теперь плеер один и создаётся в player-manager.js. -->

  <!-- Scripts -->
  <!-- Перевод интерфейса: tr() и словари нужны всем остальным скриптам,
       некоторые переводят строки уже при загрузке -->
  <script src="js/core/tr.js"></script>
  <script src="js/locales/en/shell.js"></script>
  <script src="js/locales/en/farming.js"></script>
  <script src="js/locales/en/core.js"></script>
  <script src="js/locales/en/settings.js"></script>
  <script src="js/locales/en/accounts.js"></script>
  <script src="js/locales/en/drops.js"></script>
  <!-- Core modules - загружаем первыми -->
  <script src="js/core/session-state.js"></script>
  <!-- SlottedWebview должен идти до наследников -->
  <script src="js/core/slotted-webview.js"></script>
  <script src="js/core/player-manager.js"></script>
  <script src="js/core/chat-manager.js"></script>
  <script src="js/core/shutdown-manager.js"></script>
  <script src="js/core/whats-new.js"></script>
  <script src="js/core/favourites-watch.js"></script>
  <script src="js/core/login-guard.js"></script>
  <script src="js/core/notification-service.js"></script>
  <script src="js/core/settings-manager.js"></script>
  <script src="js/core/tooltip-service.js"></script>
  <script src="js/core/title-manager.js"></script>

  <!-- Utils - утилиты (Icons — раньше всех страниц и шаблонов) -->
  <script src="js/utils/date-helpers.js"></script>
  <script src="js/utils/dom-helpers.js"></script>

  <!-- Features - функционал -->
  <script src="js/features/farming/bonus-collector-script.js"></script>
  <script src="js/core/network-limit.js"></script>
  <script src="js/core/game-mode.js"></script>
  <script src="js/core/csv-export.js"></script>
  <script src="js/core/quiet-hours.js"></script>
  <script src="js/core/chime.js"></script>
  <!-- Журнал событий: после звука (журнал и звук зовут вместе), до страниц -->
  <script src="js/core/event-log.js"></script>
  <script src="js/core/event-log-ui.js"></script>
  <script src="js/core/ics-export.js"></script>
  <script src="js/core/backup.js"></script>
  <script src="js/core/traffic-estimate.js"></script>
  <script src="js/features/farming/campaign-value.js"></script>
  <script src="js/features/calendar/campaign-calendar.js"></script>
  <script src="js/features/calendar/campaign-history.js"></script>
  <script src="js/features/calendar/missed-drops.js"></script>
  <script src="js/features/farming/stream-picker.js"></script>
  <script src="js/features/farming/drop-credit.js"></script>
  <!-- Строка статуса фарминга (сайдбар и страница): читает зачёт выше -->
  <script src="js/features/farming/farm-status.js"></script>
  <script src="js/features/farming/viewers-chart.js"></script>
  <script src="js/features/farming/category-details-modal.js"></script>

  <!-- Legacy modules -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/streaming.js"></script>

  <!-- Pages -->
  <script src="js/pages/accounts-page.js"></script>
  <script src="js/pages/farming-page.js"></script>
  <script src="js/pages/subscriptions-page.js"></script>
  <script src="js/pages/statistics-page.js"></script>
  <script src="js/pages/settings-page.js"></script>
  <script src="js/updater.js"></script>
  <!-- Окно обновления строит updater.js сам: вторая копия разметки с теми
       же id лежала здесь и перехватывала стили и обращения по id -->
  <!-- Router & App -->
  <script src="js/router.js"></script>
  <script src="js/pages/calendar-page.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

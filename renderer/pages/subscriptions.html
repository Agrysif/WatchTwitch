<div class="subscriptions-page">
  <!-- Шапка: название и число каналов слева, действия страницы справа.
       Подзаголовок убран: он повторял название раздела другими словами.
       Без data-i18n: текст переводит tr.dom по словарю locales/en, а
       data-i18n поверх него ставил бы старые подписи из i18n.js -->
  <div class="page-header">
    <div class="subs-heading">
      <h1 class="page-title">Подписки</h1>
      <span class="badge num" id="subs-count" title="Каналов в подписках"></span>
    </div>
    <div class="page-actions" id="subs-page-actions" hidden>
      <button type="button" class="btn btn-ghost btn-icon" id="refresh-subs-btn" title="Обновить список" aria-label="Обновить список">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <button type="button" class="btn btn-ghost btn-sm" id="cleanup-subs-btn" title="Отписаться от каналов, которые не стримили больше 30 дней">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Очистить неактивные</span>
      </button>
    </div>
  </div>

  <!-- Нет входа -->
  <div id="subscriptions-auth-section" class="card" style="display: none;">
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <h3>Войдите в Twitch</h3>
      <p>Без входа список подписок недоступен.</p>
      <button type="button" id="subscriptions-auth-btn" class="btn btn-primary">
        <img src="../assets/logo.svg" alt="" class="btn-logo" width="18" height="18">
        <span>Войти через Twitch</span>
      </button>
    </div>
  </div>

  <!-- Главное содержимое -->
  <div id="subscriptions-content" style="display: none;">
    <!-- Приоритет подписок — настройка фарминга, а не фильтр списка, поэтому
         стоит над панелью поиска отдельной строкой, без своей карточки -->
    <label class="subs-priority" for="priority-subs-toggle">
      <input type="checkbox" id="priority-subs-toggle" class="switch">
      <span class="subs-priority-text">
        <span class="subs-priority-title">Сначала каналы из подписок</span>
        <span class="subs-priority-hint">Если в категории идёт эфир канала из подписок, фарминг выберет его. Избранные — первыми.</span>
      </span>
    </label>

    <!-- Метка для наблюдателя: панель ниже прилипает к верху при прокрутке,
         и по этой точке страница понимает, что она уже прилипла -->
    <div class="subs-toolbar-sentinel" aria-hidden="true"></div>

    <!-- Поиск, фильтры и вид — одной строкой. Прилипает к верху: на длинном
         списке поиск и фильтры нужны и внизу -->
    <div class="subs-toolbar" id="subs-toolbar">
      <div class="search-field subs-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" class="input-field" autocomplete="off" spellcheck="false" placeholder="Поиск по каналам…" aria-label="Поиск по каналам">
        <button type="button" class="btn btn-ghost btn-icon btn-sm subs-search-clear" id="subs-search-clear" title="Очистить поиск" aria-label="Очистить поиск" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="segmented subs-filters" id="subs-filters" role="group" aria-label="Какие каналы показать">
        <button type="button" class="active" data-filter="all" aria-pressed="true">
          <span>Все</span><span class="count" data-count="all"></span>
        </button>
        <button type="button" data-filter="active" aria-pressed="false">
          <span>В эфире</span><span class="count" data-count="active"></span>
        </button>
        <button type="button" data-filter="inactive" aria-pressed="false" title="Не стримили больше 30 дней">
          <span>Неактивные</span><span class="count" data-count="inactive"></span>
        </button>
        <button type="button" data-filter="favorites" aria-pressed="false">
          <span>Избранные</span><span class="count" data-count="favorites"></span>
        </button>
      </div>

      <div class="segmented subs-view" id="subs-view" role="group" aria-label="Вид списка">
        <button type="button" class="active" data-view="list" aria-pressed="true" title="Список" aria-label="Список">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h.01M3 12h.01M3 18h.01"/><path d="M8 6h13M8 12h13M8 18h13"/></svg>
        </button>
        <button type="button" data-view="grid" aria-pressed="false" title="Плитка" aria-label="Плитка">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Список каналов -->
    <div class="card subs-list-card">
      <!-- Строки и подписи групп строит subscriptions-page.js -->
      <div id="subscriptions-list" class="list subscriptions-list-view" style="display: none;"></div>

      <!-- Пустое состояние: текст зависит от фильтра и поиска, его пишет страница -->
      <div id="subscriptions-empty" style="display: none;"></div>

      <!-- Загрузка: серые строки на месте будущих, чтобы страница не прыгала -->
      <div id="subscriptions-loading" class="subs-skeleton" aria-busy="true" aria-label="Загрузка подписок">
        <div class="subs-skeleton-row" aria-hidden="true"><span class="skeleton subs-skeleton-avatar"></span><span class="subs-skeleton-lines"><span class="skeleton skeleton-text" style="width: 32%;"></span><span class="skeleton skeleton-text" style="width: 20%;"></span></span></div>
        <div class="subs-skeleton-row" aria-hidden="true"><span class="skeleton subs-skeleton-avatar"></span><span class="subs-skeleton-lines"><span class="skeleton skeleton-text" style="width: 24%;"></span><span class="skeleton skeleton-text" style="width: 28%;"></span></span></div>
        <div class="subs-skeleton-row" aria-hidden="true"><span class="skeleton subs-skeleton-avatar"></span><span class="subs-skeleton-lines"><span class="skeleton skeleton-text" style="width: 38%;"></span><span class="skeleton skeleton-text" style="width: 18%;"></span></span></div>
        <div class="subs-skeleton-row" aria-hidden="true"><span class="skeleton subs-skeleton-avatar"></span><span class="subs-skeleton-lines"><span class="skeleton skeleton-text" style="width: 28%;"></span><span class="skeleton skeleton-text" style="width: 24%;"></span></span></div>
        <div class="subs-skeleton-row" aria-hidden="true"><span class="skeleton subs-skeleton-avatar"></span><span class="subs-skeleton-lines"><span class="skeleton skeleton-text" style="width: 34%;"></span><span class="skeleton skeleton-text" style="width: 22%;"></span></span></div>
      </div>
    </div>
  </div>

  <!-- Окно канала. Видимость переключает страница через style.display -->
  <div id="channel-detail-modal" class="dialog-backdrop subs-channel-backdrop" style="display: none;">
    <div class="dialog subs-channel-dialog" role="dialog" aria-modal="true" aria-labelledby="channel-dialog-title" tabindex="-1">
      <button type="button" id="close-modal-btn" class="dialog-close subs-channel-close" title="Закрыть" aria-label="Закрыть">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <!-- Содержимое строит subscriptions-page.js -->
      <div id="modal-content" class="subs-channel-content"></div>
    </div>
  </div>
</div>

<div class="farming-page">
  <div class="page-header">
    <h1 class="page-title" data-i18n="farming.title">Фарминг дропсов</h1>
    <p class="page-subtitle" data-i18n="farming.subtitle">Автоматический сбор дропсов на Twitch</p>
  </div>

  <!-- Current Stream Info -->
  <div class="card">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div class="card-title" data-i18n="farming.currentStream">Текущий стрим</div>
    </div>
    
    <div id="current-stream-info">
      <div class="no-stream waiting-state" tabindex="0" role="button" aria-label="Ожидание стрима">
        <div class="waiting-icon" aria-hidden="true">
          <span class="waiting-ring waiting-ring-outer"></span>
          <span class="waiting-ring waiting-ring-inner"></span>
          <span class="waiting-dot"></span>
        </div>
        <p class="waiting-label" data-i18n="farming.idle">Ожидание</p>
      </div>
    </div>
    
    <!-- Twitch Player -->
    <div id="twitch-player-container" style="display: none;">
      <div id="player-chat-grid" style="display: grid; grid-template-columns: 1fr; gap: 12px; transition: grid-template-columns 0.3s ease;">
        <!-- Player 16:9 -->
        <!-- Слот для постоянного плеера. Сам webview живёт в index.html и только
             позиционируется поверх этого места — см. renderer/js/core/player-manager.js -->
        <div id="farming-player-slot"
             style="position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: var(--radius-md); overflow: hidden;"></div>
        
        <!-- Chat -->
        <!-- Слот для постоянного чата. Сам webview живёт вне страницы и только
             позиционируется поверх этого места — см. renderer/js/core/chat-manager.js.
             Внутри страницы он держаться не может: роутер перерисовывает её через
             innerHTML, и вместе с чатом умирал автосбор бонусных сундуков. -->
        <div id="twitch-chat-container" style="display: none; background: var(--bg-secondary); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); opacity: 0; transform: translateX(20px); transition: opacity 0.3s ease, transform 0.3s ease;">
          <div id="farming-chat-slot" style="width: 100%; height: 450px; background: #13161a;"></div>
        </div>
      </div>
      
      <!-- Hidden WebView for drops data extraction -->
      <webview id="drops-data-extractor"
           style="display: none; width: 1px; height: 1px; position: absolute; left: -9999px;"
               partition="persist:twitch"
               webpreferences="contextIsolation=false"></webview>
      
      <!-- Preload setup script for all webviews on this page -->
      <script>
        const setupPreloads = async () => {
          const preloadPath = await window.electronAPI.getWebviewPreloadPath();
          console.log('[FarmingPage] Setting preload path:', preloadPath);
          
          const webviews = document.querySelectorAll('webview');
          console.log('[FarmingPage] Found webviews:', webviews.length);
          
          for (const webview of webviews) {
            // Check if preload is not already set to this path
            if (webview.getAttribute('preload') !== preloadPath) {
              console.log('[FarmingPage] Setting preload for webview:', webview.id);
              webview.setAttribute('preload', preloadPath);
              webview.dataset.preloadSet = 'true';
            }
          }
        };

        // Set preload when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupPreloads);
        } else {
          setupPreloads();
        }

        // Слушатель канала 'webview-traffic' удалён: этого канала больше нет
        // (трафик считается в main-процессе), а сам обработчик вешался на
        // document при каждом заходе на страницу и никогда не снимался.
      </script>
      
      <div style="display: flex; gap: 12px; margin-top: 10px;">
        <!-- Stream Details - full width -->
        <div id="stream-details" class="stream-info-card">
          <!-- Game Cover with gradient background -->
          <div class="stream-cover-wrapper">
            <img id="stream-game-cover" src="" alt="Game" class="stream-game-cover">
          </div>
          
          <!-- Info -->
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
              <div class="stream-live-indicator"></div>
              <span id="stream-channel" class="stream-channel-name"></span>
            </div>
            <div id="stream-game" class="stream-game-name"></div>
            <div id="stream-title" class="stream-title-text"></div>
            <div id="stream-category" class="stream-category-tag"></div>
          </div>
          
          <!-- Mini Stats -->
          <div class="stream-stats-container">
            <div class="stream-stat-item">
              <div class="stream-stat-label">Зрители</div>
              <div id="stream-viewers" class="stream-stat-value">-</div>
            </div>
            <div class="stream-stat-divider"></div>
            <div class="stream-stat-item">
              <div class="stream-stat-label">Uptime</div>
              <div id="stream-uptime" class="stream-stat-value">-</div>
            </div>
          </div>
          
          <!-- Chat Toggle -->
          <button class="btn btn-secondary stream-chat-toggle" id="toggle-chat-btn" title="Показать/скрыть чат">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Actions Bar - Redesigned -->
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="btn btn-secondary" id="prev-category-btn" style="flex: 1; height: 42px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg-secondary); border: 1px solid var(--border-color); transition: all 0.2s ease;" title="Предыдущая категория">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          <span style="font-weight: 500;" data-i18n="farming.back">Назад</span>
        </button>
        <button class="btn btn-primary" id="next-stream-btn" style="flex: 2; height: 42px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #7c5cff; border: none; box-shadow: none; transition: all 0.2s ease; color: white;" title="Следующий стрим">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 3l14 9-14 9V3z"/>
          </svg>
          <span style="font-weight: 600; color: white;" data-i18n="farming.anotherStream">Другой стрим</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 17l5-5-5-5v10z"/>
            <path d="M6 17l5-5-5-5v10z"/>
          </svg>
        </button>
        <button class="btn btn-secondary" id="next-category-btn" style="flex: 1; height: 42px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg-secondary); border: 1px solid var(--border-color); transition: all 0.2s ease;" title="Следующая категория">
          <span style="font-weight: 500;" data-i18n="farming.forward">Вперед</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
      
      <!-- Canvas for viewers chart -->
      <canvas id="viewers-chart" width="400" height="240" style="position: fixed; display: none; pointer-events: auto; z-index: 10000; background: rgba(14, 14, 16, 0.99); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); padding: 16px;"></canvas>
    </div>
    
    <!-- Drops Progress Horizontal Block -->
    <div id="drops-progress-horizontal" style="display: none; margin-top: 12px; padding: 16px; background: rgba(124, 92, 255, 0.08); border-radius: var(--radius-md); border: 1px solid rgba(124, 92, 255, 0.25); box-shadow: none;">
      <!-- Контент генерируется динамически в updateDropsHorizontalProgress() -->
    </div>
    
    <!-- Channel Points Stats - показывается только во время фарминга -->
    <div id="channel-points-card" class="card" style="margin-top: 12px; display: none;">
      <div class="card-title" style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        <span data-i18n="farming.channelPoints">Баллы канала</span>
      </div>
      
      <!-- Метрики без отдельных рамок: три вложенных блока внутри карточки
           давали лишний визуальный шум. Разделяем вертикальными линиями. -->
      <div class="points-grid">
        <!-- За сессию -->
        <div class="points-cell">
          <div class="points-head">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/>
            </svg>
            <span data-i18n="farming.sessionPoints">За сессию</span>
          </div>
          <div id="channel-points-total" class="points-value">-</div>
          <div id="channel-points-earned" class="points-sub points-sub-accent">-</div>
        </div>

        <!-- Сундучки -->
        <div class="points-cell">
          <div class="points-head">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="8" width="18" height="12" rx="2"/>
              <path d="M3 11h18M12 8V4M8 8V6M16 8V6"/>
            </svg>
            <span data-i18n="farming.chests">Сундучки</span>
          </div>
          <div id="bonus-chests-count" class="points-value">-</div>
          <div id="bonus-chests-points" class="points-sub">-</div>
        </div>

        <!-- За этот стрим -->
        <div class="points-cell">
          <div class="points-head">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span data-i18n="farming.thisStream">За этот стрим</span>
          </div>
          <div id="passive-points-earned" class="points-value">-</div>
        </div>
      </div>
    </div>
    
    <!-- Drops Progress -->
    <div id="drops-progress-container" style="display: none; margin-top: 16px; padding: 16px; background: var(--bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2L10 6H14L11 9L12 13L8 10.5L4 13L5 9L2 6H6L8 2Z"/>
          </svg>
          <span data-i18n="farming.dropsProgress">Прогресс дропсов</span>
        </h3>
        <div id="drops-overall-progress" style="font-size: 14px; color: var(--text-secondary);"></div>
      </div>
      
      <div id="drops-campaigns-list"></div>
      
      <div id="drops-time-remaining" style="margin-top: 12px; padding: 12px; background: rgba(124, 92, 255, 0.1); border-radius: var(--radius-sm); border: 1px solid rgba(124, 92, 255, 0.3); font-size: 13px; color: var(--text-secondary); text-align: center; display: none;"></div>
    </div>
  </div>

  <!-- Categories List -->
  <div class="card">
    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="card-title" style="margin: 0;" data-i18n="farming.selectCategories">Выберите категории</div>
        <button class="btn btn-secondary" id="drops-filter-btn" style="padding: 8px 14px; font-size: 13px; display: flex; align-items: center; gap: 6px; height: 36px;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <circle cx="6" cy="6" r="6"/>
          </svg>
          <span data-i18n="farming.dropsFirst">Drops сверху</span>
        </button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" id="add-all-drops-btn" style="height: 36px; background: #7c5cff; border: none;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2L10 6H14L11 9L12 13L8 10.5L4 13L5 9L2 6H6L8 2Z"/>
          </svg>
          <span data-i18n="farming.farmAllDrops">Фарм всех дропсов</span>
        </button>
        <button class="btn btn-secondary" id="add-category-btn" style="height: 36px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span data-i18n="farming.addCategory">Добавить категорию</span>
        </button>
      </div>
    </div>

    <div id="categories-list">
      <div class="no-categories" style="text-align: center; padding: 40px; color: var(--text-secondary);">
        <p data-i18n="farming.noCategories">Нет выбранных категорий</p>
        <p style="font-size: 14px; margin-top: 8px;" data-i18n="farming.dragToReorder">Перетащите для изменения порядка</p>
      </div>
    </div>
  </div>

</div>

<style>
  /* Stream Info Card Styles */
  .stream-info-card {
    flex: 1;
    padding: 14px 18px;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border-color);
    display: flex;
    gap: 14px;
    align-items: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .stream-info-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: transparent;
    opacity: 0.8;
  }

  .stream-info-card:hover {
    /* Removed hover effects */
  }

  .stream-cover-wrapper {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: var(--radius-md);
  }

  .stream-cover-wrapper::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: transparent;
    transform: translateX(-100%) translateY(-100%) rotate(45deg);
    transition: transform 0.6s;
    z-index: 1;
  }

  .stream-info-card:hover .stream-cover-wrapper::before {
    transform: translateX(100%) translateY(100%) rotate(45deg);
  }

  .stream-game-cover {
    width: 50px;
    height: 68px;
    border-radius: var(--radius-md);
    object-fit: cover;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    position: relative;
  }

  .stream-live-indicator {
    width: 8px;
    height: 8px;
    background: #35d08a;
    border-radius: var(--radius-circle);
    animation: pulse 2s infinite;
    box-shadow: 0 0 8px #35d08a;
  }

  .stream-channel-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stream-game-name {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .stream-title-text {
    font-size: 11px;
    color: var(--text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 5px;
  }

  /* Плашка с тегами стрима.
     В правиле стояло два display подряд (none, затем inline-block) — побеждал
     второй, поэтому плашка отрисовывалась всегда, в том числе пустой серой
     капсулой, когда у стрима нет тегов. Теперь показывается только с текстом. */
  .stream-category-tag {
    display: none;
    font-size: 10px;
    color: #848d9b;
    padding: 4px 10px;
    background: rgba(173, 173, 184, 0.15);
    border: 1px solid rgba(173, 173, 184, 0.25);
    border-radius: var(--radius-sm);
    font-weight: 500;
  }

  .stream-category-tag:not(:empty) {
    display: inline-block;
  }

  .stream-stats-container {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
  }

  .stream-stat-item {
    text-align: center;
  }

  .stream-stat-label {
    font-size: 10px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .stream-stat-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stream-stat-divider {
    width: 1px;
    height: 32px;
    background: transparent;
  }

  .stream-chat-toggle {
    height: 36px;
    width: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: var(--radius-md);
    transition: all 0.2s ease;
  }

  .stream-chat-toggle:hover {
    transform: translateY(-2px);
    border-color: var(--accent-color);
  }

  .no-stream {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .stream-card {
    padding: 16px;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
  }

  .stream-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .status-indicator {
    width: 12px;
    height: 12px;
    border-radius: var(--radius-circle);
    animation: pulse 2s infinite;
  }

  .stream-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .stream-preview {
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  .stream-preview img {
    width: 100%;
    height: auto;
    display: block;
  }

  .category-item {
    padding: 16px;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    margin-bottom: 12px;
    cursor: grab;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    min-height: 90px;
  }

  .category-item.ending-soon {
    border-color: #f97316;
    background: rgba(249, 115, 22, 0.05);
  }

  .category-item.ended {
    opacity: 0.5;
  }

  .category-item:hover {
    background: rgba(124, 92, 255, 0.05);
  }

  .category-item.drops-completed {
    border-color: rgba(53, 208, 138, 0.3);
    background: rgba(53, 208, 138, 0.05);
  }

  .category-item.drops-completed .category-status {
    color: #35d08a;
  }

  .category-drag-handle {
    color: var(--text-secondary);
    cursor: grab;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .category-item.dragging {
    opacity: 0.5;
    cursor: grabbing;
  }

  .category-image {
    width: 50px;
    height: 70px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
  }

  .category-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .category-item:hover .category-image img {
    animation: category-image-scroll 3s linear infinite alternate;
  }

  @keyframes category-image-scroll {
    from {
      object-position: center top;
    }
    to {
      object-position: center bottom;
    }
  }

  /* min-width: 0 обязателен. По умолчанию флекс-элемент не сжимается уже
     своего содержимого, поэтому строка категории переполнялась: кнопки
     справа уезжали за границу карточки, а появление кнопки закрепления
     сдвигало Play всего на пару пикселей вместо освобождения места. */
  .category-info {
    flex: 1;
    min-width: 0;
  }

  .category-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .category-status {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    flex-wrap: wrap;
  }

  .time-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    font-size: 12px;
    font-weight: 500;
  }

  .time-badge.ending-soon {
    background: rgba(249, 115, 22, 0.2);
    color: #f97316;
  }

  .time-badge.ended {
    background: rgba(239, 68, 68, 0.2);
    color: #ef4444;
  }

  .time-badge svg {
    flex-shrink: 0;
  }

  .category-priority {
    background: var(--accent-color);
    color: white;
    padding: 6px 12px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    min-width: 40px;
    text-align: center;
  }

  .category-remove {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .category-play-btn {
    background: rgba(124, 92, 255, 0.1);

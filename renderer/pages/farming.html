<div class="farming-page">
  <!-- Заголовок без data-i18n: прежний ключ farming.title — «Фарминг дропсов»,
       и i18n.updatePage() вернул бы его при каждом переходе. Подзаголовок
       убран: он повторял название раздела другими словами. Остальные подписи
       тоже без data-i18n: их переводит tr.dom() по locales/en/farming.js, а
       data-i18n поверх вернул бы старый перевод из i18n.js -->
  <div class="page-header">
    <h1 class="page-title">Фарминг</h1>
    <div class="page-actions"></div>
  </div>

  <!-- Сводка «Пока вас не было» (заполняет event-log-ui.js) и чек-лист
       первого запуска (заполняет farming-page.js). Пустые слоты места не
       занимают -->
  <div id="away-summary-slot"></div>
  <div id="onboarding-slot"></div>

  <!-- Главный блок: что происходит прямо сейчас. Плеер и колонка статуса
       стоят рядом, чтобы на 1000×650 без прокрутки было видно и стрим, и
       следующую награду, и кнопки -->
  <section class="card farm-hero" id="farm-hero">
    <div id="current-stream-info">
      <!-- Заглушка — это кнопка запуска (обработчик в farming-page.js на
           #current-stream-info). Вложенную <button> не делаем: заглушка сама
           role="button", а «кнопка» внутри — только её вид -->
      <div class="no-stream waiting-state" tabindex="0" role="button" aria-label="Начать фарминг">
        <div class="waiting-icon" aria-hidden="true">
          <span class="waiting-ring waiting-ring-outer"></span>
          <span class="waiting-ring waiting-ring-inner"></span>
          <span class="waiting-dot"></span>
        </div>
        <p class="waiting-label">Фарминг не запущен</p>
        <p class="waiting-sub"></p>
        <p class="waiting-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 6 4.5z"/></svg>
          <span>Начать фарминг</span>
        </p>
      </div>
    </div>

    <div id="twitch-player-container" style="display: none;">
      <div class="farm-hero-grid">
        <div class="farm-hero-media">
          <!-- Колонки сетки пишет toggleChat() в style: показан чат — «плеер + 340px» -->
          <div id="player-chat-grid">
            <!-- Слот постоянного плеера. Сам webview живёт в index.html и только
                 позиционируется поверх этого места — см. core/player-manager.js -->
            <div id="farming-player-slot"></div>

            <!-- Слот постоянного чата. Webview чата тоже живёт вне страницы:
                 роутер перерисовывает её через innerHTML, и вместе с чатом
                 умирал бы автосбор бонусных сундуков (core/chat-manager.js) -->
            <div id="twitch-chat-container" style="display: none; opacity: 0; transform: translateX(20px);">
              <div id="farming-chat-slot"></div>
            </div>
          </div>
        </div>

        <div class="farm-hero-side">
          <!-- Что происходит — фразой. Пишет features/farming/farm-status.js -->
          <div class="farm-status-line" id="farming-status-line" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span class="farm-status-main"></span>
            <span class="farm-status-sub"></span>
          </div>

          <!-- Карточка канала. Клик открывает подробности стрима
               (setupStreamInfoClick в farming-page.js) -->
          <div id="stream-details" class="stream-info-card" role="button" tabindex="0" aria-label="Подробнее о стриме">
            <div class="stream-cover-wrapper">
              <img id="stream-game-cover" src="" alt="" class="stream-game-cover">
            </div>
            <div class="stream-info-main">
              <div class="stream-channel-line">
                <span id="stream-channel" class="stream-channel-name"></span>
              </div>
              <div id="stream-game" class="stream-game-name"></div>
              <div id="stream-title" class="stream-title-text"></div>
              <!-- Число зрителей и слово к нему пишет startStreamStatsUpdate;
                   наведение на строку показывает график зрителей -->
              <div class="stream-meta row-meta">
                <span class="stream-meta-viewers"><span id="stream-viewers" class="num">-</span> <span id="stream-viewers-label">зрителей</span></span>
                <span class="stream-meta-uptime">в эфире <span id="stream-uptime" class="num">-</span></span>
              </div>
              <div id="stream-category" class="stream-category-tag"></div>
            </div>
            <svg class="stream-info-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </div>

          <!-- Ближайшая награда: картинка, «через 25 мин · к 03:40», процент.
               Пишет updateNextReward(); без кампании блок скрыт -->
          <div class="farm-next" id="farm-next-reward" hidden></div>

          <!-- Баллы канала: показывается только во время фарминга. Три числа
               в одну строку без отдельных рамок -->
          <div id="channel-points-card" class="points-strip" style="display: none;">
            <div class="farm-side-label">Баллы канала</div>
            <div class="points-grid">
              <div class="points-cell">
                <div class="points-head">За сессию</div>
                <div id="channel-points-total" class="points-value num">-</div>
                <div id="channel-points-earned" class="points-sub">-</div>
              </div>
              <div class="points-cell">
                <div class="points-head">Сундуки</div>
                <div id="bonus-chests-count" class="points-value num">-</div>
                <div id="bonus-chests-points" class="points-sub">-</div>
              </div>
              <div class="points-cell">
                <div class="points-head">За этот стрим</div>
                <div id="passive-points-earned" class="points-value num">-</div>
              </div>
            </div>
          </div>

          <!-- Управление. Раньше самой заметной была фиолетовая «Другой стрим»,
               а две кнопки по краям были подписаны одинаково «Категория».
               Теперь все три спокойные, а категории листаются переключателем
               «‹ Категория ›» — понятно, что стрелки про категорию -->
          <div class="farm-hero-actions">
            <button class="btn btn-secondary farm-next-stream" id="next-stream-btn" title="Переключиться на другой стрим этой же категории">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
              <span>Другой стрим</span>
            </button>
            <div class="farm-cat-stepper" role="group" aria-label="Переключить категорию">
              <button class="btn btn-ghost btn-icon btn-sm" id="prev-category-btn" title="Предыдущая категория очереди" aria-label="Предыдущая категория">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <span class="farm-cat-stepper-label" aria-hidden="true">Категория</span>
              <button class="btn btn-ghost btn-icon btn-sm" id="next-category-btn" title="Следующая категория очереди" aria-label="Следующая категория">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Скрипт ниже — прежний, без изменений: проставляет preload всем
           webview документа. Роутер выполняет его один раз при первой
           загрузке страницы -->
      <script>
        const setupPreloads = async () => {
          const preloadPath = await window.electronAPI.getWebviewPreloadPath();
          console.log('[FarmingPage] Setting preload path:', preloadPath);

          const webviews = document.querySelectorAll('webview');
          console.log('[FarmingPage] Found webviews:', webviews.length);

          for (const webview of webviews) {
            // Check if preload is not already set to this path
            if (webview.getAttribute('preload') !== preloadPath) {
              console.log('[FarmingPage] Setting preload for webview:', webview.id);
              webview.setAttribute('preload', preloadPath);
              webview.dataset.preloadSet = 'true';
            }
          }
        };

        // Set preload when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupPreloads);
        } else {
          setupPreloads();
        }

        // Слушатель канала 'webview-traffic' удалён: этого канала больше нет
        // (трафик считается в main-процессе), а сам обработчик вешался на
        // document при каждом заходе на страницу и никогда не снимался.
      </script>

      <!-- График зрителей: всплывает при наведении на строку «зрителей».
           Место и видимость пишет setupViewersChart, вид — page-farming.css -->
      <canvas id="viewers-chart" width="400" height="240" class="viewers-chart-popover" style="display: none;"></canvas>
    </div>

    <!-- Награды кампании. Разметку собирает renderDropsPanel() -->
    <div id="drops-progress-horizontal" style="display: none;"></div>

    <!-- Предложение сменить вручную запущенную категорию. Отдельно от
         панели наград: та перерисовывается каждые полминуты и стирала
         предложение в тот же миг, когда оно появлялось -->
    <div id="switch-offer-slot" style="display: none;"></div>

    <!-- Прежний список дропсов. Не показывается (его место заняла панель
         наград выше), но id остаются: к ним обращается farming-page.js -->
    <div id="drops-progress-container" class="drops-legacy" style="display: none;">
      <div class="drops-legacy-head">
        <div class="card-title">Прогресс дропсов</div>
        <div id="drops-overall-progress" class="drops-legacy-overall"></div>
      </div>
      <div id="drops-campaigns-list"></div>
      <div id="drops-time-remaining" class="drops-legacy-time" style="display: none;"></div>
    </div>
  </section>

  <!-- Очередь категорий: в каком порядке приложение их фармит -->
  <section class="card farm-queue">
    <div class="card-header farm-queue-head">
      <div class="card-title">Очередь категорий <span class="badge num" id="farm-queue-count"></span></div>
      <div class="farm-queue-actions">
        <button class="btn btn-ghost btn-sm" id="drops-filter-btn" aria-pressed="false" title="Поднять наверх категории с идущими кампаниями">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.53 2.3a.53.53 0 0 1 .95 0l2.31 4.68a2.12 2.12 0 0 0 1.6 1.16l5.16.76a.53.53 0 0 1 .3.9l-3.74 3.64a2.12 2.12 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0L6.4 21.01a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.91l5.16-.75a2.12 2.12 0 0 0 1.6-1.16z"/></svg>
          <span>Сначала с дропсами</span>
        </button>
        <!-- Режим включён или нет — показывает переключатель внутри кнопки
             (aria-pressed), подпись не меняется -->
        <button class="btn btn-secondary btn-sm" id="add-all-drops-btn" aria-pressed="false" title="Сам добавлять все игры, где сейчас идут кампании с дропсами">
          <span class="switch switch-sm" aria-hidden="true"></span>
          <span class="farm-autodrops-label">Автофарм всех дропсов</span>
        </button>
        <button class="btn btn-secondary btn-sm" id="add-category-btn" title="Добавить игру в очередь">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>Добавить</span>
        </button>
      </div>
    </div>

    <!-- Подсказка о выгодной игре, которой нет в очереди -->
    <div id="category-suggestion"></div>

    <div id="categories-list" class="list">
      <div class="no-categories empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h.01M3 12h.01M3 18h.01"/><path d="M8 6h13M8 12h13M8 18h13"/></svg>
        <h3>Очередь пуста</h3>
        <p>Добавьте игру или включите «Автофарм всех дропсов» — приложение само соберёт игры с кампаниями.</p>
      </div>
    </div>
  </section>
</div>

<script src="./js/features/drops/drop-detail-modal.js"></script>

<div class="drops-page">
    <!-- Шапка: название слева, переключатель разделов и действия справа.
         #tabsContainer — вся правая группа: её показывает и прячет
         drops-page.js через style.display вместе со входом в Twitch.
         Подписи переводит tr.dom по словарю locales/en/drops.js; data-i18n
         здесь нет: старый словарь i18n.js перебил бы перевод своим -->
    <div class="page-header">
        <h1 class="page-title">Дропсы</h1>
        <div id="tabsContainer" class="page-actions drops-header-actions" style="display: none;">
            <div class="segmented drops-tabs" role="tablist" aria-label="Раздел дропсов">
                <button type="button" class="drops-tab-button active" data-tab="progress" role="tab" aria-selected="true" aria-controls="progressTab">
                    <span class="drops-tab-text">Прогресс</span>
                </button>
                <button type="button" class="drops-tab-button" data-tab="inventory" role="tab" aria-selected="false" aria-controls="inventoryTab">
                    <span class="drops-tab-text">Инвентарь</span>
                </button>
            </div>
            <button type="button" id="refreshButton" class="btn btn-ghost btn-icon" title="Обновить" aria-label="Обновить">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            <!-- Вид кнопки (главная или неактивная) решает drops-page.js:
                 главная — только когда есть что забрать -->
            <button type="button" id="claimAllButton" class="btn btn-secondary btn-sm" disabled title="Забирать пока нечего">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
                <span>Забрать все</span>
            </button>
        </div>
    </div>

    <!-- Нет входа в Twitch -->
    <div id="authSection" class="card drops-auth" style="display: none;">
        <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
            <h3>Войдите в Twitch</h3>
            <p>Без входа нельзя посмотреть прогресс и забрать награды.</p>
            <button type="button" id="authButton" class="btn btn-primary">
                <img src="../assets/logo.svg" alt="" class="drops-auth-logo" width="16" height="16">
                <span>Войти через Twitch</span>
            </button>
        </div>
    </div>

    <!-- Сводка одной строкой: кто вошёл и сколько всего. Внешний блок
         показывает drops-page.js (style.display = 'block'), строка внутри
         раскладывается сама. is-pending прячет числа до первого ответа
         Twitch, чтобы не мелькали нули -->
    <div id="userInfo" class="drops-summary is-pending" style="display: none;">
        <div class="drops-summary-row">
            <img id="userAvatar" class="drops-summary-avatar" src="" alt="">
            <span id="userName" class="drops-summary-name"></span>
            <div class="drops-summary-stats">
                <span title="Наград получено за всё время">Получено <b id="totalClaimedDrops" class="num">0</b></span>
                <span title="Кампании, в которых ещё есть что получить">В процессе <b id="activeCampaignsCount" class="num">0</b></span>
                <span title="Кампании, где всё получено или срок вышел">Завершено <b id="completedCampaignsCount" class="num">0</b></span>
            </div>
            <button type="button" id="logoutButton" class="btn btn-ghost btn-sm drops-account-btn" title="Аккаунты Twitch: добавить, сменить или удалить">Аккаунт</button>
        </div>
    </div>

    <!-- Прогресс кампаний -->
    <div id="progressTab" class="tab-content" role="tabpanel" style="display: none;">
        <!-- Загрузка: две карточки-скелетона на месте будущих кампаний -->
        <div id="loadingState" class="drops-loading" aria-busy="true" aria-label="Загрузка дропсов">
            <div class="drops-campaigns-grid">
                <div class="card campaign-skeleton" aria-hidden="true">
                    <div class="campaign-skeleton-head">
                        <div class="skeleton campaign-skeleton-cover"></div>
                        <div class="campaign-skeleton-lines">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text"></div>
                        </div>
                    </div>
                    <div class="campaign-skeleton-tiles">
                        <div class="skeleton skeleton-tile"></div>
                        <div class="skeleton skeleton-tile"></div>
                        <div class="skeleton skeleton-tile"></div>
                        <div class="skeleton skeleton-tile"></div>
                    </div>
                </div>
                <div class="card campaign-skeleton" aria-hidden="true">
                    <div class="campaign-skeleton-head">
                        <div class="skeleton campaign-skeleton-cover"></div>
                        <div class="campaign-skeleton-lines">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text"></div>
                        </div>
                    </div>
                    <div class="campaign-skeleton-tiles">
                        <div class="skeleton skeleton-tile"></div>
                        <div class="skeleton skeleton-tile"></div>
                        <div class="skeleton skeleton-tile"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Пустое состояние и причины «данных нет» — разметку пишет drops-page.js -->
        <div id="emptyState" class="card drops-empty" style="display: none;"></div>

        <div id="campaignsContainer" class="drops-campaigns-grid"></div>
        <!-- Сюда же drops-page.js добавляет свёрнутый блок «Завершённые» -->
    </div>

    <!-- Инвентарь: всё полученное -->
    <div id="inventoryTab" class="tab-content" role="tabpanel" style="display: none;">
        <!-- Без своего заголовка: раздел уже назван вкладкой «Инвентарь» в шапке -->
        <div class="card drops-inventory-card">
            <!-- Обёртка нужна: drops-page.js пишет ей style.display = 'block',
                 а сетка скелетонов внутри остаётся сеткой -->
            <div id="inventoryLoading" aria-busy="true" aria-label="Загрузка инвентаря">
                <div class="drops-inventory-grid">
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                    <div class="skeleton skeleton-tile" aria-hidden="true"></div>
                </div>
            </div>

            <div id="inventoryEmpty" class="drops-empty" style="display: none;"></div>

            <div id="inventoryContainer" class="drops-inventory"></div>
        </div>
    </div>
</div>

<script src="./js/features/drops/drop-detail-modal.js"></script>
<script src="./js/pages/drops-page.js"></script>

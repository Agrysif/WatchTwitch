<div class="accounts-page">
  <div class="page-header">
    <h1 class="page-title" data-i18n="accounts.title">Аккаунты</h1>
    <p class="page-subtitle" data-i18n="accounts.subtitle">Управление Twitch аккаунтами</p>
  </div>

  <div class="card">
    <div class="add-account-section">
      <button class="accounts-btn accounts-btn-primary" id="add-twitch-btn">
        <div class="accounts-btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
          </svg>
        </div>
        <span data-i18n="accounts.loginWithTwitch">Войти через OAuth</span>
      </button>
      <button class="accounts-btn accounts-btn-outline" id="add-cookies-btn">
        <div class="accounts-btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="currentColor"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <circle cx="15" cy="11" r="1.5" fill="currentColor"/>
            <circle cx="10" cy="14" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <span data-i18n="accounts.loginWithCookies">Войти через Cookies</span>
      </button>
    </div>

    <div id="accounts-list">
      <div class="no-accounts" style="text-align: center; padding: 60px; color: var(--text-secondary);">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="opacity: 0.3; margin: 0 auto;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-width="2"/>
          <circle cx="12" cy="7" r="4" stroke-width="2"/>
        </svg>
        <p style="margin-top: 16px;" data-i18n="accounts.noAccounts">Нет добавленных аккаунтов</p>
      </div>
    </div>

    <!-- External login hint -->
    <div class="external-login-hint">
      <div class="external-login-content">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <path d="M12 16v-4M12 8h.01" stroke-width="2"/>
        </svg>
        <div class="external-login-text">
          <strong data-i18n="accounts.hint">Совет:</strong> <span data-i18n="accounts.oauthHint">Если у вас уже открыт Twitch в браузере, OAuth окно автоматически использует этот аккаунт. Для входа с другого аккаунта:</span>
        </div>
      </div>
      <button class="accounts-btn accounts-btn-outline" id="open-browser-btn">
        <div class="accounts-btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <span data-i18n="accounts.openBrowser">Открыть Twitch в браузере</span>
      </button>
    </div>
  </div>
</div>

    height: 36px;

    background: var(--bg-tertiary);

  /* Modal Base Styles */
  .auth-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
  }

  .auth-modal::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    z-index: -1;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .auth-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 9999;
    pointer-events: none;
  }

  .auth-modal-content {

    z-index: 10001;

    border-radius: var(--radius-md);

    overflow-x: hidden;

    height: 40px;

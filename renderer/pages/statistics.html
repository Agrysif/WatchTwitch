<div class="statistics-page">
  <!-- Период — в шапке: от него зависят все цифры ниже, и отдельная
       карточка под ним отнимала первый экран у самих итогов -->
  <div class="page-header">
    <h1 class="page-title" data-i18n="statistics.title">Статистика</h1>
    <div class="page-actions">
      <div class="segmented stats-period" role="group" aria-label="Период">
        <button type="button" class="period-btn active" data-period="all" aria-pressed="true">
          <span data-i18n="statistics.allTime">Всё время</span>
        </button>
        <button type="button" class="period-btn" data-period="month" aria-pressed="false">
          <span data-i18n="statistics.thisMonth">Этот месяц</span>
        </button>
        <button type="button" class="period-btn" data-period="custom" aria-pressed="false">Свой период</button>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" id="export-stats-btn" title="Выгрузить сессии выбранного периода в CSV">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
        </svg>
        <span>CSV</span>
      </button>
    </div>
  </div>

  <!-- Свой период — строкой под шапкой. Видимое поле — текст в русском
       формате даты, а выбор открывает скрытое системное поле type="date" -->
  <div id="custom-date-picker" class="stats-range" style="display: none;">
    <span class="stats-range-word">С</span>
    <div class="stats-date">
      <input type="text" id="start-date-display" class="input-field" readonly placeholder="дд.мм.гггг" aria-label="Дата начала">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <input type="date" id="start-date" class="stats-date-native" tabindex="-1" aria-hidden="true">
    </div>
    <span class="stats-range-word">по</span>
    <div class="stats-date">
      <input type="text" id="end-date-display" class="input-field" readonly placeholder="дд.мм.гггг" aria-label="Дата окончания">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <input type="date" id="end-date" class="stats-date-native" tabindex="-1" aria-hidden="true">
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="apply-date-range">Применить</button>
  </div>

  <!-- 1. Итоги — главное на странице, поэтому первыми. Иконки
       монохромные: цвет квадрата под значком ничего не сообщал -->
  <div class="kpi-grid stats-totals">
    <div class="kpi stat-card">
      <div class="kpi-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <span>Просмотрено</span>
      </div>
      <div class="kpi-value" id="total-watch-time">0 мин</div>
      <div class="kpi-sub" id="total-sessions-sub"></div>
    </div>

    <div class="kpi stat-card">
      <div class="kpi-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
        </svg>
        <span>Наград получено</span>
      </div>
      <div class="kpi-value" id="drops-collected">0</div>
    </div>

    <div class="kpi stat-card">
      <div class="kpi-label">
        <!-- Значок баллов канала (круг с дугой, как на Twitch). Раньше здесь
             стоял «$», хотя баллы — не деньги -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 7a5 5 0 0 1 5 5"/>
        </svg>
        <span>Баллов заработано</span>
      </div>
      <div class="kpi-value" id="total-points">0</div>
    </div>

    <div class="kpi stat-card">
      <div class="kpi-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 12h6M14 12h6"/><rect x="10" y="10" width="4" height="5" rx="1"/>
        </svg>
        <span>Сундуков собрано</span>
      </div>
      <div class="kpi-value" id="total-chests">0</div>
    </div>
  </div>

  <!-- 2. Аналитика: выводы из накопленных цифр, а не сами цифры -->
  <div class="card analytics-card" id="analytics-card" style="display: none;">
    <div class="card-header">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/>
        </svg>
        <span>Аналитика</span>
      </div>
    </div>
    <div class="analytics-grid" id="analytics-grid"></div>
    <div class="analytics-note" id="analytics-note"></div>
  </div>

  <!-- 3. Топ категорий: где уходит время -->
  <div class="card stats-top-card">
    <div class="card-header">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h.01M3 12h.01M3 18h.01"/><path d="M8 6h13M8 12h13M8 18h13"/>
        </svg>
        <span data-i18n="statistics.topCategories">Топ категорий</span>
      </div>
      <span class="card-subtitle">по времени просмотра</span>
    </div>
    <div id="top-categories-section" class="list top-cat-list">
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
    </div>
  </div>

  <!-- 4. Упущенные награды. Спрятана, пока приложение не накопило историю -->
  <div class="card missed-card" id="missed-card" style="display: none;"></div>

  <!-- 5. Последние сессии. Подписи колонок — один раз в шапке, а не под
       каждым числом: десять повторов «длительность» читались как шум -->
  <div class="card stats-sessions-card">
    <div class="card-header">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
        </svg>
        <span data-i18n="statistics.recentSessions">Последние сессии</span>
      </div>
      <div class="session-cols" id="session-cols" aria-hidden="true">
        <span>Время</span>
        <span>Баллы</span>
        <span>Трафик</span>
      </div>
    </div>
    <div id="recent-sessions" class="list">
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
      <div class="skeleton skeleton-row" aria-hidden="true"></div>
    </div>
  </div>

  <!-- 6. Сессии, не попавшие в итоги: больше суток без отметок о просмотре.
       Без этой строки итоги молча расходились бы со списком сессий -->
  <div class="stats-excluded" id="stats-excluded" style="display: none;"></div>
</div>

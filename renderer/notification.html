<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      height: 100px;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      -webkit-app-region: no-drag;
    }

    .drop-notification {
      background: rgba(124, 92, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      padding: 16px;
      width: 100%;
      height: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 14px;
      align-items: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .drop-notification:hover {
      transform: scale(1.02);
    }

    .drop-notification::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .drop-notification:hover::before {
      opacity: 1;
    }

    .drop-notification-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-notification-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drop-notification-content {
      flex: 1;
      min-width: 0;
    }

    .drop-notification-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .drop-notification-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .drop-notification-icon-svg {
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }

    .drop-notification-drop-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .drop-notification-game {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .drop-notification-game-icon {
      width: 14px;
      height: 14px;
    }

    .drop-notification-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 0 0 12px 12px;
      transform-origin: left;
      animation: dropNotificationProgress 5s linear forwards;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    @keyframes dropNotificationProgress {
      from {
        width: 100%;
      }
      to {
        width: 0%;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }

    .drop-notification {
      animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.closing .drop-notification {
      animation: slideOut 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
  <link rel="stylesheet" href="styles/fonts.css">
</head>
<body>
  <div class="drop-notification" onclick="closeNotification()">
    <div class="drop-notification-icon">
      <img id="drop-icon" src="" alt="Drop icon" crossorigin="anonymous">
    </div>
    <div class="drop-notification-content">
      <div class="drop-notification-header">
        <div class="drop-notification-title">
          <svg class="drop-notification-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7v11h6v-6h8v6h6V7L12 2z" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="11" r="2" fill="white"/>
            <path d="M8 18v4M16 18v4" stroke="white" stroke-width="2"/>
          </svg>
          Дроп получен!
        </div>
      </div>
      <div class="drop-notification-drop-name" id="drop-name">8x 250 Lucky Envelopes</div>
      <div class="drop-notification-game">
        <svg class="drop-notification-game-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span id="game-name">Palia</span>
      </div>
    </div>
    <div class="drop-notification-progress"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Получаем данные через IPC вместо URL параметров
    ipcRenderer.on('notification-data', (event, data) => {
      console.log('[Notification] Received data via IPC:', data);
      
      const { dropName, gameName, dropIcon } = data;
      
      // Заполняем данные
      document.getElementById('drop-name').textContent = dropName || '';
      document.getElementById('game-name').textContent = gameName || '';
      
      // Устанавливаем картинку
      const imgElement = document.getElementById('drop-icon');
      if (dropIcon && dropIcon.length > 0 && dropIcon.startsWith('data:image/')) {
        console.log('[Notification] Setting img.src to base64 image');
        imgElement.onload = function() {
          console.log('[Notification] Image loaded! Width:', this.width, 'Height:', this.height);
        };
        imgElement.onerror = function(e) {
          console.error('[Notification] Image load error:', e);
          this.style.display = 'none';
        };
        imgElement.src = dropIcon;
      } else {
        console.warn('[Notification] No valid dropIcon, showing placeholder');
        // Заменяем на SVG placeholder
        const iconContainer = imgElement.parentElement;
        iconContainer.innerHTML = `
          <svg viewBox="0 0 64 64" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="giftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect x="12" y="28" width="40" height="28" rx="4" fill="url(#giftGradient)"/>
            <rect x="30" y="28" width="4" height="28" fill="rgba(255,255,255,0.3)"/>
            <rect x="12" y="36" width="40" height="4" fill="rgba(255,255,255,0.3)"/>
            <path d="M32 8 L24 20 L28 20 L28 28 L36 28 L36 20 L40 20 Z" fill="url(#giftGradient)"/>
            <circle cx="24" cy="16" r="4" fill="#fbbf24"/>
            <circle cx="40" cy="16" r="4" fill="#fbbf24"/>
          </svg>
        `;
      }
    });

    // Закрываем через 5 секунд
    setTimeout(() => {
      closeNotification();
    }, 5000);

    function closeNotification() {
      document.body.classList.add('closing');
      setTimeout(() => {
        ipcRenderer.send('close-drop-notification');
      }, 300);
    }
  </script>
</body>
</html>

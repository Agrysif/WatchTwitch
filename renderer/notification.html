<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Награда получена</title>
  <style>
    /* Окно о полученной награде — в углу экрана, поверх всего.
     *
     * Окно прозрачное и чуть больше карточки: вокруг неё место под тень,
     * иначе тень обрезалась бы краем окна ровной линией. Цвета — свои
     * переменные: themes.css это окно не грузит. Тема приходит от main
     * вместе с данными (settings.theme).
     *
     * Раньше это была сплошная фиолетовая плашка с белым текстом и
     * значком-«домиком»: она кричала громче, чем того стоит рядовая
     * награда, а белое на фиолетовом читалось хуже, чем текст на карточке.
     */
    :root {
      --card: #1b1c20;
      --card-hover: #212227;
      --border: rgba(255, 255, 255, 0.10);
      --text: #ececf0;
      --text-2: #a3a7b1;
      --text-3: #858a95;
      --success: #3ccf8e;
      --accent: #7c5cff;
      --art-bg: #26282d;
      --badge-ring: #1b1c20;
      --close-hover: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.38), 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    body.theme-light {
      --card: #ffffff;
      --card-hover: #f7f8fa;
      --border: rgba(16, 20, 28, 0.12);
      --text: #15171c;
      --text-2: #545a66;
      --text-3: #6b717c;
      --success: #17845a;
      --accent: #6a4cf0;
      --art-bg: #f0f1f4;
      --badge-ring: #ffffff;
      --close-hover: rgba(16, 20, 28, 0.06);
      --shadow: 0 8px 24px rgba(16, 20, 28, 0.16), 0 1px 3px rgba(16, 20, 28, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 412px;
      height: 128px;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      -webkit-app-region: no-drag;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .card {
      position: absolute;
      left: 16px;
      top: 8px;
      width: 380px;
      height: 96px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 40px 0 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: background-color 120ms ease-out;
    }

    .card:hover {
      background: var(--card-hover);
    }

    /* Появление и уход — короткие: окно сообщает, а не развлекает */
    .card.is-in {
      opacity: 1;
      transform: none;
      transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 120ms ease-out;
    }

    body.closing .card {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 160ms ease-in, transform 160ms ease-in;
    }

    .art {
      position: relative;
      flex: none;
      width: 56px;
      height: 56px;
    }

    .art-frame {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--art-bg);
      color: var(--text-3);
    }

    .art-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .art-frame img[hidden],
    .art-frame svg[hidden] {
      display: none;
    }

    /* Отметка «получено» в углу картинки. В сводке вместо галочки — число */
    .art-badge {
      position: absolute;
      right: -5px;
      bottom: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--success);
      color: #fff;
      border: 2px solid var(--badge-ring);
      font: 700 11px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    body.theme-dark .art-badge {
      color: #0f1012;
    }

    .art-badge svg {
      width: 11px;
      height: 11px;
    }

    .text {
      flex: 1;
      min-width: 0;
    }

    .eyebrow {
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: var(--success);
    }

    body.kind-test .eyebrow {
      color: var(--text-2);
    }

    .name {
      margin-top: 2px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 1px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta:empty {
      display: none;
    }

    /* Крестик виден при наведении: без курсора он только отвлекает */
    .close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms ease-out, background-color 120ms ease-out, color 120ms ease-out;
    }

    .card:hover .close {
      opacity: 1;
    }

    .close:hover {
      background: var(--close-hover);
      color: var(--text);
    }

    .close svg {
      width: 14px;
      height: 14px;
    }

    /* Полоса времени: сколько окно ещё провисит. При наведении стоит */
    .timebar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
    }

    .timebar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent);
      opacity: 0.6;
      transform-origin: left;
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      body.closing .card {
        transform: none;
      }
    }
  </style>
</head>
<body class="theme-dark kind-drop">
  <div class="card" id="card" role="alert" aria-live="assertive">
    <div class="art">
      <div class="art-frame">
        <img id="drop-icon" alt="" hidden>
        <svg id="gift-placeholder" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="8" width="18" height="4" rx="1"/>
          <path d="M12 8v13"/>
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
        </svg>
      </div>
      <span class="art-badge" id="art-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </div>
    <div class="text">
      <div class="eyebrow" id="eyebrow">Награда получена</div>
      <div class="name" id="drop-name"></div>
      <div class="meta" id="game-name"></div>
    </div>
    <button type="button" class="close" id="close-btn" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="timebar" aria-hidden="true"><div class="timebar-fill" id="timebar"></div></div>
  </div>

  <script>
    // Node в этом окне нет: данные и закрытие идут через мост window.notif
    // (preload-notification.js).
    //
    // Часы окна. Сколько жить, говорит main (lifeMs): он считает от
    // создания окна, а его страховка закрывает окно через 6,5 с, если
    // страница не справилась сама. Наведение ставит часы и полосу на паузу,
    // а после ухода курсора окно живёт ещё хотя бы 2 с — дочитать.
    var card = document.getElementById('card');
    var bar = document.getElementById('timebar');
    var life = { total: 6000, left: 6000, tickAt: 0, bornAt: 0, timer: null, anim: null, paused: false, started: false, closing: false };

    function currentLeft() {
      return life.paused ? life.left : Math.max(0, life.left - (performance.now() - life.tickAt));
    }

    function currentFraction() {
      return life.total > 0 ? Math.min(1, currentLeft() / life.total) : 0;
    }

    function schedule(leftMs, fromFraction) {
      clearTimeout(life.timer);
      life.left = leftMs;
      life.tickAt = performance.now();
      life.paused = false;
      // Имя ищется в момент вызова: проверка подменяет closeNotification и
      // ждёт, что окно закроет страховка main
      life.timer = setTimeout(function () { closeNotification(); }, leftMs);
      if (life.anim) life.anim.cancel();
      life.anim = bar.animate(
        [{ transform: 'scaleX(' + fromFraction + ')' }, { transform: 'scaleX(0)' }],
        { duration: Math.max(1, leftMs), easing: 'linear', fill: 'forwards' }
      );
    }

    function startLife(lifeMs) {
      life.started = true;
      life.total = lifeMs;
      life.bornAt = performance.now();
      schedule(lifeMs, 1);
    }

    function pauseLife() {
      if (!life.started || life.paused || life.closing) return;
      life.left = currentLeft();
      life.paused = true;
      clearTimeout(life.timer);
      if (life.anim) life.anim.pause();
    }

    // После ухода курсора — не меньше 2 с, чтобы дочитать, и не больше
    // 3,5 с: страховка main после ухода курсора — 4 с, и окно, которое
    // ещё «жило» бы дольше, она бы оборвала без анимации
    function resumeLife() {
      if (!life.started || !life.paused || life.closing) return;
      var left = Math.min(Math.max(life.left, 2000), 3500);
      schedule(left, Math.min(1, left / life.total));
    }

    // За окном в очереди ждут ещё награды: это живёт 3,5 с от появления
    function shortenLife(maxLifeMs) {
      if (!life.started || life.closing) return;
      var cap = Math.max(800, maxLifeMs - (performance.now() - life.bornAt));
      if (life.paused) {
        life.left = Math.min(life.left, cap);
        return;
      }
      if (cap < currentLeft()) schedule(cap, currentFraction());
    }

    function closeNotification() {
      if (life.closing) return;
      life.closing = true;
      clearTimeout(life.timer);
      document.body.classList.add('closing');
      setTimeout(function () { window.notif.close(); }, 170);
    }

    function setImage(src) {
      var img = document.getElementById('drop-icon');
      var placeholder = document.getElementById('gift-placeholder');
      if (typeof src === 'string' && src.indexOf('data:image/') === 0) {
        img.onload = function () {
          img.hidden = false;
          placeholder.setAttribute('hidden', '');
        };
        // Битая картинка — нейтральный подарок, а не значок «нет файла»
        img.onerror = function () {
          img.hidden = true;
          placeholder.removeAttribute('hidden');
        };
        img.src = src;
      }
    }

    window.notif.onData(function (data) {
      data = data || {};
      var kind = data.kind === 'summary' || data.kind === 'test' ? data.kind : 'drop';
      document.body.className = (data.theme === 'light' ? 'theme-light' : 'theme-dark') + ' kind-' + kind +
        (document.body.classList.contains('closing') ? ' closing' : '');

      var eyebrow = data.eyebrow ||
        (kind === 'summary' ? 'Награды получены' : (kind === 'test' ? 'Проверка уведомления' : 'Награда получена'));
      var name = data.dropName || (kind === 'test' ? 'Так будет выглядеть награда' : '');
      var meta = kind === 'drop'
        ? [data.gameName, data.meta].filter(Boolean).join(' · ')
        : (data.meta || data.gameName || (kind === 'test' ? 'WatchTwitch' : ''));

      document.getElementById('eyebrow').textContent = eyebrow;
      document.getElementById('drop-name').textContent = name;
      document.getElementById('game-name').textContent = meta;
      document.getElementById('drop-name').title = name;

      // В сводке в углу картинки — сколько наград, а не галочка
      var badge = document.getElementById('art-badge');
      if (kind === 'summary' && data.count > 1) {
        badge.textContent = data.count > 99 ? '99+' : String(data.count);
      }

      setImage(data.dropIcon);

      if (!life.started) {
        card.classList.add('is-in');
        var lifeMs = Number(data.lifeMs);
        startLife(lifeMs > 0 ? Math.min(lifeMs, 30000) : 6000);
      }
    });

    if (window.notif.onQueue) {
      window.notif.onQueue(function () { shortenLife(3500); });
    }

    card.addEventListener('mouseenter', function () {
      pauseLife();
      window.notif.hold && window.notif.hold(true);
    });
    card.addEventListener('mouseleave', function () {
      window.notif.hold && window.notif.hold(false);
      resumeLife();
    });

    // Щелчок по карточке — открыть приложение на наградах. Окно уходит
    // сразу: main выведет главное окно вперёд и закроет это сам
    card.addEventListener('click', function () {
      if (life.closing) return;
      life.closing = true;
      clearTimeout(life.timer);
      document.body.classList.add('closing');
      if (window.notif.open) window.notif.open();
      else window.notif.close();
    });

    document.getElementById('close-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      closeNotification();
    });
  </script>
</body>
</html>
